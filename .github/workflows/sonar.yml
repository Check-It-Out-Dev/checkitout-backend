# SonarQube Cloud analysis — the quality gate CodeQL does not provide.
#
# CodeQL answers "is this exploitable". Sonar answers "is this maintainable, and is the code you
# just wrote worse than the code you already had". The second question is the one that makes a
# backlog of 655 existing alerts survivable: Sonar's gate can be set on NEW code only, so the
# ratchet tightens without demanding the whole history be fixed first.
#
# GitHub's own starter template for this still points at SonarSource/sonarcloud-github-action, which
# is archived; the maintained action is sonarqube-scan-action, pinned here to the lowest major that
# runs on the node24 runtime.
#
# BEFORE THIS DOES ANYTHING the owner has to do three things once, all free for public repositories:
#   1. sign in at sonarcloud.io with GitHub and install the SonarQube Cloud app on Check-It-Out-Dev
#   2. create the organisation and import this repository (project key below)
#   3. put the generated token in this repository's secrets as SONAR_TOKEN
# Until then the analysis step skips with a message rather than failing the build, so landing this
# early costs nothing.
name: sonar

# Called by pr.yml; still dispatchable on its own while you are working on it.
on:
  workflow_call:
  workflow_dispatch:

# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running.
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Sonar attributes issues to authors and measures new code against a baseline; a shallow
          # clone leaves it guessing at both.
          fetch-depth: 0

      - name: Not configured yet
        if: env.SONAR_TOKEN == ''
        run: |
          {
            echo "### SonarQube Cloud is not configured"
            echo
            echo "No \`SONAR_TOKEN\` secret, so the analysis was skipped rather than failed."
            echo "It is free for public repositories; see the header of this workflow for the three steps."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Sonar reads coverage rather than measuring it, and needs the compiled classes to resolve
      # types. The unit tier produces both in one pass.
      - name: Unit tier with coverage
        if: env.SONAR_TOKEN != ''
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test -Ptest -DskipITs -Dpmd.skip=true -Dcpd.skip=true -Dcheckstyle.skip=true

      # And the integration tier, because a whole tier of tests was invisible to this number.
      #
      # Sonar was reading only jacoco-unit, so every line whose only test is an integration test
      # counted as uncovered -- new code in AppliedOpportunityService showed 11 uncovered lines and
      # 10 uncovered branches on the same day three integration tests were written for exactly that
      # block. The gate was measuring which tier happened to be wired up, not which code is tested.
      #
      # The two profiles are mutually exclusive by construction (`integration` sets skipTests), so
      # this is a second invocation rather than a second profile on the first. It costs the job
      # about ninety seconds and Testcontainers pulls; the sonar job runs beside the tests job, so
      # the pipeline's wall clock does not move. Never fatal on its own: an unavailable Docker
      # daemon should degrade the coverage number, not lose the analysis.
      - name: Integration tier with coverage
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          ./mvnw -B -ntp verify -Pintegration -Dpmd.skip=true -Dcpd.skip=true -Dcheckstyle.skip=true

      - name: Analyse
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2  # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
