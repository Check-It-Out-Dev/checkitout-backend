# The backend image for the test substrate and the sandbox: `mvnw package` on the runner, the existing
# Dockerfile with SKIP_MAVEN_BUILD=true, pushed to ghcr.io as <short sha>, <branch> and (on the default
# branch) latest. The package must be public for the kind cluster and the sandbox host to pull it without
# credentials. When FE_DISPATCH_TOKEN is set, the frontend's contract-check runs against this exact sha.
name: build-image

on:
  push:
    branches: [main, greenfield]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/check-it-out-dev/checkitout-backend

jobs:
  image:
    name: Package and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp -DskipTests -DskipPmd=true package
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: docker/instagram-platform/Dockerfile
          build-args: SKIP_MAVEN_BUILD=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  notify-frontend:
    name: Ask the frontend to check the contract
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.FE_DISPATCH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4
        with:
          token: ${{ secrets.FE_DISPATCH_TOKEN }}
          repository: Check-It-Out-Dev/checkitout-frontend
          event-type: backend-published
          client-payload: '{"sha": "${{ github.sha }}", "tag": "${{ needs.image.outputs.sha }}"}'
