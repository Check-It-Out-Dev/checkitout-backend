# The backend test workflow, on GitHub-hosted runners only (never self-hosted on a public repository).
#   unit         every pull request and push: `mvnw test -Ptest`               ≈ 2.5 min
#   integration  every push: `mvnw verify -Pintegration` (Testcontainers)      ≈ 4 min
#   e2e          nightly and on demand: `mvnw verify -Pe2e` (Cucumber, in-process) ≈ 10 min
#   report       Allure 3 with history on GitHub Pages, one directory per run
# The Windows named-pipe strategy in testcontainers.properties is removed on the runner until the
# repository drops it (auto-detection is right on both platforms). Methodology: the frontend repository's
# docs/ci/ARCHITECTURE.md §6.
name: ci-tests

on:
  pull_request:
    branches: [main, greenfield]
  push:
    branches: [main, greenfield]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [unit, integration, e2e, all]
        default: all

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  MAVEN_ARGS: -B -ntp -DskipPmd=true
  TZ: UTC

jobs:
  unit:
    name: Unit (surefire, -Ptest)
    if: ${{ github.event_name != 'schedule' && (inputs.tier == '' || inputs.tier == 'unit' || inputs.tier == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw && ./mvnw $MAVEN_ARGS test -Ptest -DskipITs
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: unit tests
          detailed_summary: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 30

  integration:
    name: Integration (failsafe, -Pintegration, Testcontainers)
    if: ${{ github.event_name == 'push' || inputs.tier == 'integration' || inputs.tier == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testcontainers on Linux
        run: sed -i '/ClientProviderStrategy/d' src/test/resources/testcontainers.properties
      - run: chmod +x mvnw && ./mvnw $MAVEN_ARGS verify -Pintegration
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/failsafe-reports/TEST-*.xml
          check_name: integration tests
          detailed_summary: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            target/failsafe-reports/*.xml
            target/site/jacoco-integration/jacoco.xml
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: End to end (Cucumber, -Pe2e)
    if: ${{ github.event_name == 'schedule' || inputs.tier == 'e2e' || inputs.tier == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testcontainers on Linux
        run: sed -i '/ClientProviderStrategy/d' src/test/resources/testcontainers.properties
      # Scenarios that need Firebase credentials skip themselves (assumeTrue) when none are present.
      - run: chmod +x mvnw && ./mvnw $MAVEN_ARGS verify -Pe2e
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/failsafe-reports/TEST-*.xml
          check_name: e2e scenarios
          detailed_summary: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            target/failsafe-reports/*.xml
            target/cucumber-reports/**
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Allure 3 with history, quality metrics, Pages
    needs: [unit, integration, e2e]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The metrics tool and the dashboard live in the frontend repository (docs/ci/METRICS.md there);
      # the backend runs the same tool on its JUnit XML.
      - uses: actions/checkout@v4
        with:
          repository: Check-It-Out-Dev/checkitout-frontend
          path: frontend
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Pages site (previous state)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allure 3 (JUnit XML from every tier, history from the previous report)
        run: |
          mkdir -p allure-results
          find results -name 'TEST-*.xml' -exec cp {} allure-results/ \;
          [ -d site/allure/latest/history ] && cp -r site/allure/latest/history allure-results/history || true
          # Allure 3's CLI takes the results directory from its config or the default ./allure-results,
          # and knows --output and --config only.
          npx --yes allure generate --output allure-report
      - name: Quality metrics into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site && rm -rf site/.git
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node frontend/tools/ci/quality-metrics.mjs --out site --workflow ci-tests --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --junit 'results/unit-results/TEST-*.xml:unit' --junit 'results/integration-results/TEST-*.xml:integration' --junit 'results/e2e-results/TEST-*.xml:e2e' \
            --jacoco results/unit-results/jacoco.xml --copy allure=allure-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false
          commit_message: "ci-tests run ${{ github.run_number }}"
