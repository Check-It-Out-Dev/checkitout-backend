# The backend test workflow, on GitHub-hosted runners only (never self-hosted on a public repository).
#   unit         every pull request and push: `mvnw test -Ptest`               ≈ 2.5 min
#   integration  every push: `mvnw verify -Pintegration` (Testcontainers)      ≈ 4 min
#   e2e          nightly and on demand: `mvnw verify -Pe2e` (Cucumber, in-process) ≈ 10 min
#   report       Allure 3 with history on GitHub Pages, one directory per run
# The Windows named-pipe strategy in testcontainers.properties is removed on the runner until the
# repository drops it (auto-detection is right on both platforms). Methodology: the frontend repository's
# docs/ci/ARCHITECTURE.md §6.
name: ci-tests

# Called by pr.yml (tier: integration) and nightly.yml (tier: all); still dispatchable on its own.
# Which tiers run is decided by `tier` alone -- never by the event -- because under workflow_call the
# event belongs to the caller and "is this a push" stops being a question this file can answer.
on:
  workflow_call:
    inputs:
      tier:
        description: "unit | integration | e2e | all"
        type: string
        default: all
      publish:
        description: Publish the Allure report and the metrics to Pages
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [unit, integration, e2e, all]
        default: all
      publish:
        description: Publish the Allure report and the metrics to Pages
        type: boolean
        default: true

# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running.
concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  MAVEN_ARGS: -B -ntp -DskipPmd=true
  TZ: UTC

jobs:
  unit:
    name: Unit (surefire, -Ptest)
    if: ${{ contains(fromJSON('["unit","integration","all"]'), inputs.tier) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The publisher is a shell script that deletes directories on a branch the whole estate
      # reads. Two seconds against a local bare repository, every run: it asserts that `latest` is
      # replaced rather than merged, that retention keeps exactly the newest reports, and that
      # another tier's directories are still left alone.
      - name: The Pages publisher still behaves
        run: bash tools/ci/publish-pages.test.sh tools/ci/publish-pages.sh

      # The other script that decides whether a tier passes. Its failure mode is the dangerous
      # direction -- a red run reported green -- so what is asserted is that an unclassified
      # category still gates, that an environment exemption excuses only the operation it names,
      # and that rewriting the baseline keeps the prose explaining the numbers.
      - name: The fuzz verdict still behaves
        run: node tools/ci/fuzz-verdict.test.mjs

      - run: chmod +x mvnw && ./mvnw $MAVEN_ARGS test -Ptest -DskipITs
      - uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          # The action does not fail a job by default, and Maven is not the only thing that can be
          # wrong: `require_tests` is what catches a tier that ran nothing and said so quietly.
          fail_on_failure: true
          require_tests: true
          check_name: unit tests
          detailed_summary: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-results
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco-unit/jacoco.xml
          if-no-files-found: warn
          retention-days: 30

  integration:
    name: Integration (failsafe, -Pintegration, Testcontainers)
    if: ${{ contains(fromJSON('["integration","all"]'), inputs.tier) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testcontainers on Linux
        run: sed -i '/ClientProviderStrategy/d' src/test/resources/testcontainers.properties
      - run: chmod +x mvnw && ./mvnw $MAVEN_ARGS verify -Pintegration
      - uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6
        if: always()
        with:
          # Both failsafe profiles write into a subdirectory of failsafe-reports, one per tier, so
          # the flat glob matched nothing and the check run said "No test results found!" over a
          # tier that had just passed. The artifact glob below already knew; this one did not.
          report_paths: target/failsafe-reports/**/TEST-*.xml
          # failsafe:verify was inheriting skipTests=true from the profile property and checking
          # nothing, so this action was the only thing standing between a failed tier and a green
          # job -- and it does not fail a job by default either. Both halves are closed now.
          fail_on_failure: true
          require_tests: true
          check_name: integration tests
          detailed_summary: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: integration-results
          path: |
            target/failsafe-reports/**/*.xml
            target/site/jacoco-e2e/jacoco.xml
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: End to end (Cucumber, -Pe2e)
    if: ${{ contains(fromJSON('["e2e","all"]'), inputs.tier) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testcontainers on Linux
        run: sed -i '/ClientProviderStrategy/d' src/test/resources/testcontainers.properties
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
      # The suite signs in for real - password sign-in, an ID token, TOTP - against the Firebase emulator
      # suite rather than the live project, so it needs no credential and cannot touch anything real. The
      # Admin SDK finds the emulators through these two variables on its own; FirebaseEmulator redirects
      # the Identity Toolkit calls the application makes by hand, and FirebaseEmulatorSeeder creates the
      # three fixed actors at context start. See docs/Tests/E2E tests.md.
      - name: Firebase emulators
        run: |
          npm install -g firebase-tools@15
          cat > /tmp/firebase.json <<'JSON'
          {
            "emulators": {
              "auth":      { "host": "127.0.0.1", "port": 9099 },
              "firestore": { "host": "127.0.0.1", "port": 8085 },
              "ui":        { "enabled": false }
            }
          }
          JSON
          firebase emulators:start --only auth,firestore --project demo-checkitout \
            --config /tmp/firebase.json > /tmp/emulators.log 2>&1 &
          # The emulator hub answers as soon as both emulators are listening.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4400/emulators >/dev/null 2>&1; then
              echo "emulators ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the emulators did not come up in 60s" >&2
          cat /tmp/emulators.log >&2
          exit 1
      - name: End to end
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
        run: chmod +x mvnw && ./mvnw $MAVEN_ARGS verify -Pe2e
      - name: Emulator log on failure
        if: failure()
        run: tail -100 /tmp/emulators.log || true
      - uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6
        if: always()
        with:
          # See the note on the integration tier: the reports are one directory down. This check
          # run reported nothing for a tier that ran fifteen suites and 2,778 green steps.
          report_paths: target/failsafe-reports/**/TEST-*.xml
          fail_on_failure: true
          require_tests: true
          check_name: e2e scenarios
          detailed_summary: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: e2e-results
          path: |
            target/failsafe-reports/**/TEST-*.xml
            target/cucumber-reports/**
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Allure 3 with history, quality metrics, Pages
    needs: [unit, integration, e2e]
    if: ${{ always() && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The metrics tool and the dashboard live in the frontend repository (docs/ci/METRICS.md there);
      # the backend runs the same tool on its JUnit XML.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Check-It-Out-Dev/checkitout-frontend
          path: frontend
          # tools/lib too: the shared scripts import the ordering comparator from it, and a
          # checkout of tools/ci alone fails at import time with ERR_MODULE_NOT_FOUND.
          sparse-checkout: |
            tools/ci
            tools/lib
      # By name into an explicit directory, one step each. Downloading everything at once used to create a
      # directory per artifact, but no longer does when the run produced exactly one - so a tier=e2e
      # dispatch landed the files at results/ instead of results/e2e-results/, and on a full run the
      # integration and e2e tiers would both claim results/failsafe-reports/. A tier that did not run has
      # no artifact, hence continue-on-error.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: unit-results
          path: results/unit-results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: integration-results
          path: results/integration-results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: e2e-results
          path: results/e2e-results
      - name: Pages site (previous state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
      # Every Cucumber runner boots the whole feature corpus and reports EVERY scenario - the ones its
      # tags select as executed, the rest as skipped - so fifteen suites emit fifteen results per scenario
      # and only the <testsuite name> tells them apart. Allure keys on classname + name, so it folded a
      # 277-scenario corpus into 165 tests with 165 "retries", and the dashboard counted 2,804 e2e tests.
      # Dropping the tag-filtered duplicates leaves one result per scenario. A scenario skipped in every
      # suite is a real skip and is kept.
      - name: Collapse the Cucumber tag-filter duplicates
        run: node frontend/tools/ci/junit-collapse-tag-skips.mjs results/e2e-results | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Allure 3 (JUnit XML from every tier, history from the Pages site)
        run: |
          mkdir -p allure-results
          find results -name 'TEST-*.xml' -exec cp {} allure-results/ \;
          # Allure 3 dropped the history/ directory Allure 2 wrote inside the report, so copying one back
          # in was a no-op and this report has never had a trend. History is now a single JSON-lines file
          # named by allurerc.mjs, read and appended by `allure generate`, and carried on the Pages site.
          cp site/allure/history-ci-tests.jsonl history.jsonl 2>/dev/null || true
          # Allure 3's CLI takes the results directory from its config or the default ./allure-results,
          # and knows --output and --config only.
          npx --yes allure generate --config .github/allurerc.mjs --output allure-report
          # Bound by size, not by line count; see the note in browser-tiers.yml.
          node frontend/tools/ci/trim-history.mjs history.jsonl
          mkdir -p site/allure && cp history.jsonl site/allure/history-ci-tests.jsonl
      # upload-artifact roots an artifact at the longest common prefix of its paths, so `target/**` uploads
      # arrive as `surefire-reports/` and `site/jacoco/`, not flattened. Six runs published "0 tests,
      # pass rate 100 %" because these globs stopped one directory short; the tool now refuses to publish
      # a run it read no tests from, so the next such slip fails the job instead of the dashboard.
      - name: Quality metrics into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p site && rm -rf site/.git
          STARTED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          DURATION=$(( $(date +%s) - $(date -d "$STARTED_AT" +%s) ))
          node frontend/tools/ci/quality-metrics.mjs --out site --workflow ci-tests --started-at "$STARTED_AT" --duration-sec "$DURATION" \
            --junit 'results/unit-results/surefire-reports/TEST-*.xml:unit' \
            --junit 'results/integration-results/failsafe-reports/TEST-*.xml:integration' \
            --junit 'results/e2e-results/failsafe-reports/**/TEST-*.xml:e2e' \
            --jacoco results/unit-results/site/jacoco-unit/jacoco.xml \
            --mutation site/mutation/latest.json --security site/security/latest.json \
            --copy allure=allure-report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A retrying overlay push rather than the action: the night runs this tier and the mutation
        # tier at the same time and both publish, so the loser of the race used to drop its result.
        run: |
          bash tools/ci/publish-pages.sh site "ci-tests run ${{ github.run_number }}"
