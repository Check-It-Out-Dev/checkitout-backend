# OWASP Top 10 coverage, as a build step.
#
# What already existed covered part of it by accident rather than by design: CodeQL reaches A01, A03,
# A08 and A10; Dependabot and dependency-review cover A06; secret scanning covers hardcoded
# credentials. Nothing covered A02, A04, A05, A07 or A09 as a gate, and nothing at all pointed a
# scanner at the RUNNING application — there was no dynamic testing of any kind.
#
#   Semgrep   p/owasp-top-ten across the whole surface, plus secrets and typescript rulesets
#   Trivy     the filesystem and the published image: CVEs in what actually ships       A06 A08
#   Checkov   the Kubernetes manifests, Dockerfiles, compose files and workflows        A05
#   Syft      an SBOM for the image, attached to the run                                A08
#
# The dynamic half lives in the frontend repository, which owns the sandbox deployment: ZAP runs a
# baseline against https://checkitout.app/sandbox/, and that host IS this backend. Pointing two
# repositories at the same URL on the same schedule would only scan it twice.
#
# Everything here is free and open source. Every scanner writes SARIF into GitHub code scanning, so
# the Security tab stays the single place to look rather than five different report formats.
#
# Tools are installed at pinned versions rather than pulled through marketplace actions on purpose:
# `actions/unpinned-tag` is one of the findings this pipeline is meant to fix, and adding fourteen
# more floating tags to fix it would be an odd way to go about it.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  SEMGREP_VERSION: "1.148.0"
  CHECKOV_VERSION: "3.2.492"
  TRIVY_VERSION: "0.74.0"

jobs:
  sast:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
      # --error is deliberately absent: the SARIF upload is the gate, and code scanning already
      # decides severity. A scanner that fails the build on its own opinion of severity ends up
      # disabled within a fortnight.
      - name: Scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/java \
            --sarif --output semgrep.sarif \
            --metrics off \
            --exclude node_modules --exclude dist --exclude coverage \
            --exclude 'src/app/api/**' --exclude '*-snapshots' \
            . || true
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("semgrep.sarif"))
          runs = r.get("runs", [])
          n = sum(len(x.get("results", [])) for x in runs)
          print(f"### Semgrep\n\n{n} finding(s) across the OWASP, secrets and TypeScript rule sets.")
          PY
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  iac:
    name: Checkov (manifests, images, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "checkov==${CHECKOV_VERSION}"
      # A05 is the category nothing else here reaches: a container running as root, a manifest with
      # no resource limits, a workflow with a token it does not need.
      - name: Scan
        run: |
          checkov --directory . \
            --framework kubernetes,dockerfile,github_actions,secrets \
            --skip-path target --skip-path node_modules \
            --output sarif --output-file-path . \
            --soft-fail || true
          if [ -f results.sarif ]; then mv results.sarif checkov.sarif; fi
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("checkov.sarif"))
          n = sum(len(x.get("results", [])) for x in r.get("runs", []))
          print(f"### Checkov\n\n{n} misconfiguration(s) in manifests, images and workflows.")
          PY
      - uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

  supply-chain:
    name: Trivy and an SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # --fail-with-body, not a bare -f: a 404 page piped into tar dies with
          # "Error is not recoverable", which says nothing about the version being wrong. It was.
          curl -sSL --fail-with-body -o /tmp/trivy.tgz "$url"
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
      # The lockfile is what Dependabot reads; this reads the same tree for CVEs Dependabot has not
      # opened a pull request for yet, and writes an SBOM of what is actually there.
      - name: Filesystem CVEs
        run: |
          trivy fs . --offline-scan --scanners vuln,secret,misconfig \
            --skip-dirs target,node_modules \
            --format sarif --output trivy.sarif --exit-code 0
          trivy fs . --offline-scan --format cyclonedx --output sbom.cdx.json --skip-dirs target,node_modules
          {
            echo "### Trivy"
            echo
            trivy fs . --offline-scan --scanners vuln --skip-dirs target,node_modules \
              --format table --severity HIGH,CRITICAL --exit-code 0 2>/dev/null | tail -25
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      # The image is what actually runs — in the sandbox, in the nightly and in the kind cluster —
      # so its base layer and its bundled JRE are part of the attack surface the tree cannot show.
      - name: Published image CVEs
        run: |
          trivy image ghcr.io/check-it-out-dev/checkitout-backend:main             --format sarif --output trivy-image.sarif --exit-code 0 --scanners vuln
          trivy image ghcr.io/check-it-out-dev/checkitout-backend:main             --format cyclonedx --output sbom-image.cdx.json
          {
            echo "### Trivy — the published image"
            echo
            trivy image ghcr.io/check-it-out-dev/checkitout-backend:main --scanners vuln               --format table --severity HIGH,CRITICAL --exit-code 0 2>/dev/null | tail -25
          } | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.run_number }}
          path: sbom*.cdx.json
          retention-days: 90
