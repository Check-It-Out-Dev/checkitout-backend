# Property-based fuzzing against the running server — the gap the contract chain did not cover.
#
# The chain already proves a lot: the OpenAPI document is generated from a booted application, the
# frontend's client is generated from that document, and three kinds of consumer fail to COMPILE when
# a field moves. What none of that proves is that the running server does what its own document says.
# Schemathesis generates requests from the schema, sends them at a real instance, and checks the
# answers against it: undocumented status codes, responses that do not match their declared schema,
# content types that were never promised, and server errors.
#
# It found something on its first run against the public sandbox — every secured operation answered
# 401 while the document declared no 401 at all (fixed by AuthFailureResponsesCustomizer).
name: api-fuzz

# Called by nightly.yml; still dispatchable on its own while you are working on it.
on:
  workflow_call:
    inputs:
      backend_tag:
        description: Backend image tag on ghcr.io; empty means the commit under test
        type: string
        default: ""
      max_examples:
        description: Generated cases per operation
        type: string
        default: "8"
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Backend image tag on ghcr.io; empty means the commit under test
        type: string
        default: ""
      max_examples:
        description: Generated cases per operation
        type: string
        default: "8"

# The group is keyed by the CALLING pipeline as well as the ref. Without `github.workflow` --
# which under workflow_call is the caller's name -- a push to main starts `pr`, `pr` calls this
# tier, and it cancels the copy the night is already running.
concurrency:
  group: api-fuzz-${{ github.workflow }}-${{ github.ref }}
  # The caller's event, because under workflow_call that is whose event it is: a superseded
  # pull-request run is waste, but a superseded push to main loses the record of what main
  # did, and a night is never worth cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which code is being fuzzed has to be answerable, and it was not: the job pulled `:main`,
  # whichever build happened to hold that tag when the runner started. Dispatching this tier
  # right after a push fuzzed the PREVIOUS commit, because build-image had not finished
  # publishing yet -- and the report said nothing about it, so eight closed findings came back
  # looking untouched. The tag is the commit's own short sha, and this waits for it.
  image:
    name: The image under test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          # Under workflow_call this is the calling pipeline's commit, which is the one whose
          # image the night wants.
          REQUESTED_TAG: ${{ inputs.backend_tag }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: check-it-out-dev/checkitout-backend
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-${COMMIT:0:7}}"   # build-image tags type=sha,format=short
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The package is public, so this needs no credential -- and asking anonymously is also
          # the proof that the image a reader of this log could pull is the one that was fuzzed.
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          for attempt in $(seq 1 60); do
            token=$(curl -sS "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            if curl -sSf -o /dev/null -H "Authorization: Bearer $token" -H "Accept: $ACCEPT" \
                "https://ghcr.io/v2/${REPOSITORY}/manifests/${TAG}"; then
              echo "Fuzzing ghcr.io/${REPOSITORY}:${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting for ghcr.io/${REPOSITORY}:${TAG} ($attempt/60)"
            sleep 15
          done
          echo "::error::ghcr.io/${REPOSITORY}:${TAG} was never published; build-image must finish first"
          exit 1

  fuzz:
    name: Schemathesis against a running backend
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      backend:
        image: ghcr.io/check-it-out-dev/checkitout-backend:${{ needs.image.outputs.tag }}
        env:
          SPRING_PROFILES_ACTIVE: dev-lite
          SPRING_DATASOURCE_HOST: postgres
          SPRING_DATASOURCE_PORT: "5432"
          SPRING_DATASOURCE_DATABASE: postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin
          SPRING_DATA_REDIS_HOST: redis
          SPRING_DATA_REDIS_PORT: "6379"
          SPRING_LIQUIBASE_CONTEXTS: dev,local,dev-lite
          SERVER_PORT: "8080"
          TZ: UTC
        ports: ["8080:8080"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8080/api/actuator/health/readiness | grep -q UP"
          --health-interval 10s --health-timeout 5s --health-retries 40 --health-start-period 60s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "schemathesis>=4,<5"

      # dev-lite mints a session without any credential, which is the whole reason this can run on a
      # public runner. Fuzzing unauthenticated would prove only that 280 paths answer 401.
      #
      # The User-Agent is pinned, and it is pinned on BOTH calls. A session is bound to the agent
      # that minted it (SessionSecurityService, hijack prevention: the UA goes into the JWT as
      # `sessionUA` and into the fingerprint, and a mismatch is a 401 before any controller runs).
      # curl signed in as `curl/8.x` while Schemathesis sent `schemathesis/4.x`, so every
      # authenticated request was rejected and the fuzzer reported "214 operations returned only
      # 401/403" as a warning rather than as the harness defect it was. Two calls, one agent.
      - name: A session to fuzz with
        id: session
        env:
          FUZZ_UA: checkitout-api-fuzz
        run: |
          set -euo pipefail
          curl -sS -D /tmp/h -o /dev/null -X POST http://localhost:8080/api/test/auth/mock-session \
            -A "$FUZZ_UA" \
            -H "Content-Type: application/json" \
            -d '{"email":"e2e.company@test.com","role":"COMPANY"}'
          COOKIES=$(grep -i '^set-cookie:' /tmp/h | sed 's/^[Ss]et-[Cc]ookie: //' | cut -d';' -f1 | paste -sd'; ' -)
          test -n "$COOKIES"
          echo "::add-mask::$COOKIES"
          echo "cookies=$COOKIES" >> "$GITHUB_OUTPUT"
          echo "signed in, $(grep -ci '^set-cookie:' /tmp/h) cookie(s)"

      - name: Fuzz
        id: fuzz
        # The expressions are bound to env rather than pasted into the script. GitHub expands them
        # into the shell TEXT before bash ever sees it, so a value carrying a quote or
        # a backtick becomes syntax rather than an argument. Semgrep's run-shell-injection.
        env:
          SESSION_COOKIES: ${{ steps.session.outputs.cookies }}
          MAX_EXAMPLES: ${{ inputs.max_examples || '8' }}
          FUZZ_UA: checkitout-api-fuzz
        run: |
          set -euo pipefail
          st run http://localhost:8080/api/v3/api-docs \
            --url http://localhost:8080/api \
            -H "Cookie: $SESSION_COOKIES" \
            -H "User-Agent: $FUZZ_UA" \
            --exclude-path-regex '^/(test|actuator|dev-lite)/' \
            --max-examples "$MAX_EXAMPLES" \
            --continue-on-failure \
            --workers 4 \
            --phases examples,coverage,fuzzing \
            --report junit --report-dir reports \
            --report-junit-path reports/junit.xml | tee /tmp/fuzz.txt
        continue-on-error: true

      # node for the verdict tool only; the fuzzer itself is Python.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: always()
        with:
          node-version: 24

      - name: What it found, and which of it is a defect
        id: verdict
        if: always()
        run: |
          set -o pipefail
          node tools/ci/fuzz-verdict.mjs \
            --report reports/junit.xml \
            --baseline tools/ci/fuzz-baseline.json \
            --json reports/fuzz-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: What the fuzzer itself printed
        if: always()
        run: |
          set -o pipefail
          {
            echo "<details><summary>Schemathesis' own summary</summary>"
            echo
            echo '```'
            sed -n '/=* SUMMARY/,$p' /tmp/fuzz.txt || echo "no summary produced"
            echo '```'
            echo
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Backend log on failure
        if: steps.fuzz.outcome != 'success'
        run: docker logs ${{ job.services.backend.id }} 2>&1 | tail -120

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: api-fuzz-${{ github.run_number }}
          path: reports/
          retention-days: 30

      # The verdict is the TOOL's, not the fuzzer's. Schemathesis exits non-zero if any check of any
      # kind failed anywhere, which on a cookie-authenticating Spring application means every run
      # forever: see the header of tools/ci/fuzz-verdict.mjs for the two categories that guarantee
      # it. A tier that is red every night teaches nobody anything, so the categories that mean the
      # SERVER is broken gate, and the rest are ratcheted against a committed baseline.
      #
      # Separated from the run step so the summary and the artifact are published either way: a red
      # run you cannot read is worth nothing.
      - name: Verdict
        if: always()
        run: |
          if [ ! -f reports/junit.xml ]; then
            echo "Schemathesis produced no report, so this tier has no verdict." >&2
            exit 1
          fi
          if [ "${{ steps.verdict.outcome }}" != "success" ]; then
            echo "See the table in the step summary: a gating category, or a tracked one over budget." >&2
            exit 1
          fi
          echo "no server-side defect, and no tracked category above its budget"
