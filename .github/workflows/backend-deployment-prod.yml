name: 🚀 Production Environment Deployment
# Production version - deploys on push to main with immutability protection

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # Needed for pushing Docker images to ghcr.io
  actions: read
  id-token: write     # Needed for authentication (GCP, OIDC, etc.)

jobs:
  config:
    name: Load Config
    uses: ./.github/workflows/reusable-config-loader.yml
    with:
      environment: prod
      config-path: src/main/resources

  validate:
    name: Validate Config  
    needs: config
    uses: ./.github/workflows/reusable-config-validator.yml
    with:
      config-json: ${{ needs.config.outputs.config-json }}
      strict-mode: true

  build:
    name: Build & Push
    needs: [config, validate]
    if: needs.validate.outputs.validation-passed == 'true'
    uses: ./.github/workflows/reusable-maven-docker-build.yml
    with:
      config-json: ${{ needs.config.outputs.config-json }}
      environment: prod
    secrets: inherit

  backup:
    name: Backup (Secure)
    needs: [config, build]
    uses: ./.github/workflows/reusable-pre_deployment-backup.yml
    with:
      config-json: ${{ needs.config.outputs.config-json }}
      config-b64: ${{ needs.config.outputs.config-b64 }}
    secrets:
      INSTAGRAM_SERVER_HOST: ${{ secrets.INSTAGRAM_SERVER_HOST }}
      INSTAGRAM_SCRIPTS_ADMIN_USER: ${{ secrets.INSTAGRAM_SCRIPTS_ADMIN_USER }}
      INSTAGRAM_SCRIPTS_ADMIN_SSH_KEY: ${{ secrets.INSTAGRAM_SCRIPTS_ADMIN_SSH_KEY }}

  deploy:
    name: Deploy & Secure
    needs: [config, build, backup]
    uses: ./.github/workflows/reusable-deploy-and-secure.yml
    with:
      config-json: ${{ needs.config.outputs.config-json }}
      image-tag: ${{ needs.build.outputs.image-tag-sha }}
      gsm-init-image-tag: ${{ needs.build.outputs.gsm-init-image-tag-sha }}
    secrets: inherit

  reload-and-validate:
    name: Reload & Validate
    needs: [config, deploy]
    uses: ./.github/workflows/reusable-reload-and-validate.yml
    with:
      config-json: ${{ needs.config.outputs.config-json }}
    secrets: inherit

  # ── Automatic rollback ────────────────────────────────────────────────────────────────────────
  # A deployment pipeline without one asks a human to notice, at whatever hour the deploy ran, that
  # the health gate never cleared. This restores the pre-deployment backup, restarts the service and
  # re-checks health, by itself.
  #
  # The condition is narrow on purpose. It needs a backup that actually exists -- rolling back to
  # nothing is worse than staying broken -- and it only fires when something AFTER the backup went
  # wrong. A failure in config, validation or build never reaches the server, so there is nothing to
  # undo, and firing then would restore over a healthy system.
  rollback:
    name: 🔄 Automatic rollback
    needs: [config, backup, deploy, reload-and-validate]
    if: >-
      always()
      && needs.backup.result == 'success'
      && (needs.deploy.result == 'failure' || needs['reload-and-validate'].result == 'failure')
    uses: ./.github/workflows/auto-rollback-systemd.yml
    with:
      environment: ${{ fromJSON(needs.config.outputs.config-json)._flat.environment }}
      deployment-path: ${{ fromJSON(needs.config.outputs.config-json)._flat.deployment_path }}
      backup-location: ${{ needs.backup.outputs.backup-location }}
      docker-compose-file: ${{ fromJSON(needs.config.outputs.config-json)._flat.docker_compose_file }}
      systemd-service-name: ${{ fromJSON(needs.config.outputs.config-json)._flat.systemd_service_name }}
      admin-home-directory: ${{ fromJSON(needs.config.outputs.config-json)._flat.admin_home_directory }}
      container-user-name: ${{ fromJSON(needs.config.outputs.config-json)._flat.container_user_name }}
      container-group-name: ${{ fromJSON(needs.config.outputs.config-json)._flat.container_group_name }}
      server-port: ${{ fromJSON(needs.config.outputs.config-json)._flat.server_port }}
      # Which stage failed, computed here rather than taken from anything a person typed. The
      # workflow binds every input to an env var before the shell sees it, so free text is safe
      # either way, but a reason that names a job is also more use at three in the morning.
      failure-reason: >-
        ${{ needs.deploy.result == 'failure' && 'Deploy stage failed' || 'Health gate never cleared after reload' }}
    secrets: inherit

  summary:
    name: Summary
    needs: [config, validate, build, backup, deploy, reload-and-validate, rollback]
    if: always()
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Config | ${{ needs.config.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backup (Secure) | ${{ needs.backup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy (Secure) | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Reload & Validate | ${{ needs['reload-and-validate'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Automatic rollback | ${{ needs.rollback.result == 'skipped' && 'not needed' || needs.rollback.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract key values from config JSON
          CONFIG='${{ needs.config.outputs.config-json }}'
          echo "### 📋 Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $(echo "$CONFIG" | jq -r '._flat.environment')" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: $(echo "$CONFIG" | jq -r '._flat.image_name')" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: $(echo "$CONFIG" | jq -r '._flat.systemd_service_name')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔐 Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scripts protected with immutability" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Mandatory secure logging enforced" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Zero-attack-window implementation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Automatic cleanup of scripts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Admin user with proper sudo permissions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🐳 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- **App Image**: ${{ needs.build.outputs.image-tag-sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GSM Init Image**: ${{ needs.build.outputs.gsm-init-image-tag-sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Duration**: ${{ needs.build.outputs.build-duration }}s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs['reload-and-validate'].outputs.deployment-status }}" >> $GITHUB_STEP_SUMMARY
