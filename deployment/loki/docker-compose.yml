# Loki Stack Docker Compose - Production Ready August 2025
version: '3.8'

services:
  # =========================================================================
  # INIT CONTAINER - Fix permissions before Loki starts
  # =========================================================================
  init-loki:
    image: busybox:1.36
    container_name: init-loki
    user: root
    command: |
      sh -c '
        echo "Fixing Loki directory permissions..."
        mkdir -p /loki /loki/chunks /loki/rules /loki/wal /loki/index /loki/index_cache /loki/compactor
        chown -R 10001:10001 /loki
        chmod -R 755 /loki
        echo "Permissions fixed!"
        ls -la /loki
      '
    volumes:
      - loki-data:/loki
    networks:
      - monitoring

  # =========================================================================
  # LOKI - Log Storage Backend
  # =========================================================================
  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    restart: unless-stopped
    # DO NOT specify user - let it run as default 10001:10001
    depends_on:
      init-loki:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LOKI_INTERNAL_PORT:-3100}:3100"
      - "127.0.0.1:9095:9095"  # gRPC port
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -target=all
      - -log.level=${LOKI_LOG_LEVEL:-info}
    volumes:
      # Config files (read-only)
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./runtime.yaml:/loki/runtime.yaml:ro
      # GCS Service Account (if using GCS)
      - ./secrets/service-account.json:/etc/loki/service-account.json:ro
      # Data volumes (managed by Docker with correct permissions)
      - loki-data:/loki
    environment:
      # GCS Authentication
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/etc/loki/service-account.json}
      # Performance tuning
      - GOGC=80
      - GOMEMLIMIT=3500MiB  # Less than 4GB limit to avoid OOM
      # Multi-tenancy
      - LOKI_TENANT_ID=${LOKI_TENANT_ID:-checkitout}
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # ALLOY - Log Collection Agent
  # =========================================================================
  alloy:
    image: grafana/alloy:v1.4.3
    container_name: alloy
    restart: unless-stopped
    # MUST run as root to read systemd journal
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
    volumes:
      # Configuration
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro

      # CRITICAL: Journal access - all paths needed for Docker
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/systemd/journal:/run/systemd/journal:ro

      # Data volumes
      - alloy-data:/var/lib/alloy/data
    environment:
      - HOSTNAME=${HOSTNAME:-vps-example02}
      - GOGC=80
      - GOMEMLIMIT=3500MiB
      - GODEBUG=madvdontneed=1
      - JOURNAL_PATH=/var/log/journal  # Explicit path
      - LOG_LEVEL=${ALLOY_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${ALLOY_INTERNAL_PORT:-12345}:12345"
    cap_add:
      - DAC_READ_SEARCH  # Required for journal access
      - SYS_ADMIN        # Required for some journal operations
      - SYS_PTRACE       # Required for process monitoring
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-x", "alloy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Named volumes - Docker manages permissions automatically
volumes:
  loki-data:
    driver: local

  alloy-data:
    driver: local
