# =============================================================================
# Loki Configuration - Single Binary Mode with GCS Backend
# Compatible with Loki 3.5.3 - August 2025so m
# =============================================================================

auth_enabled: false

# Single binary mode - all components in one process
target: all

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

  # HTTP server settings
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s
  http_server_idle_timeout: 120s

  # GRPC server settings
  grpc_server_max_recv_msg_size: 8388608  # 8MB
  grpc_server_max_send_msg_size: 8388608  # 8MB
  grpc_server_max_concurrent_streams: 1000

# Common configuration shared by multiple components
common:
  path_prefix: /loki
  storage:
    gcs:
      bucket_name: "checkitout-logs-eu"
      chunk_buffer_size: 10485760  # 10MB
      request_timeout: 60s
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Schema configuration
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

# Storage configuration
storage_config:
  gcs:
    bucket_name: "checkitout-logs-eu"
    chunk_buffer_size: 10485760  # 10MB
    request_timeout: 60s
    enable_http2: true

  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h

# Ingester configuration
ingester:
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
    checkpoint_duration: 5m
    replay_memory_ceiling: 1GB

  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    num_tokens: 128
    heartbeat_period: 5s
    heartbeat_timeout: 1m
    join_after: 0s
    min_ready_duration: 0s
    final_sleep: 0s

  # Chunk settings
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  chunk_encoding: snappy
  chunk_target_size: 1572864  # 1.5MB
  max_chunk_age: 1h

  # Concurrency
  concurrent_flushes: 32
  flush_check_period: 30s
  flush_op_timeout: 10m
  autoforget_unhealthy: true

# Querier configuration - FIXED: removed nested engine block
querier:
  max_concurrent: 20
  query_ingesters_within: 3h
  # Removed query_timeout, max_samples, max_outstanding_per_tenant - moved to limits_config

# Query range configuration
query_range:
  align_queries_with_step: true
  max_retries: 5
  parallelise_shardable_queries: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 500
        ttl: 24h

# Frontend configuration
frontend:
  compress_responses: true
  max_outstanding_per_tenant: 2048
  log_queries_longer_than: 10s

# Compactor configuration - FIXED: removed shared_store
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true  # ENABLED: Delete logs after 30 days (ToS compliance)
  retention_delete_delay: 2h  # Delay before deletion for safety
  retention_delete_worker_count: 150  # Parallel deletion workers
  # REMOVED: shared_store field (deprecated in 3.x)
  delete_request_store: gcs  # Uses main storage config

# Limits configuration - FIXED: added max_query_lookback
limits_config:
  # Ingestion limits
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 200

  # Per-stream limits
  per_stream_rate_limit: 50MB
  per_stream_rate_limit_burst: 100MB

  # Query limits
  query_timeout: 5m  # Moved from querier section
  max_query_series: 50000000  # Renamed from max_samples
  # Note: max_outstanding_per_tenant is in frontend section, not here
  max_entries_limit_per_query: 50000
  max_streams_per_user: 0  # 0 = unlimited
  max_global_streams_per_user: 100000
  max_chunks_per_query: 20000000
  max_query_length: 8760h  # 365 days
  max_query_parallelism: 32
  max_cache_freshness_per_query: 10m
  max_query_lookback: 0  # FIXED: replaces max_look_back_period

  # Retention - ToS specifies 30 days for log retention
  retention_period: 720h  # 30 days (24h * 30)

  # Other limits
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  creation_grace_period: 10m
  max_line_size: 256KB
  max_line_size_truncate: false

  # Cardinality limits
  cardinality_limit: 200000
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30

  # Query splitting
  split_queries_by_interval: 24h

  # Metadata
  allow_structured_metadata: true
  max_structured_metadata_size: 64KB
  max_structured_metadata_entries_count: 128

# Chunk store configuration - FIXED: removed max_look_back_period
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 2048
      ttl: 1h

  write_dedupe_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 512
      ttl: 10m
  
  # REMOVED: max_look_back_period (moved to limits_config)

# Ruler configuration (disabled for single binary)
ruler:
  enable_api: false
  storage:
    type: local
    local:
      directory: /loki/rules

# Query scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 32768
  grpc_client_config:
    max_send_msg_size: 8388608  # 8MB

# Pattern ingester (disabled)
pattern_ingester:
  enabled: false

# Index gateway (not needed for single binary)
index_gateway:
  mode: simple

# Runtime config
runtime_config:
  file: /loki/runtime.yaml
  period: 10s

# Tracing (disabled)
tracing:
  enabled: false

# Analytics
analytics:
  reporting_enabled: false

# Server configuration for single binary
memberlist:
  bind_addr: []
  bind_port: 7946
  join_members: []
