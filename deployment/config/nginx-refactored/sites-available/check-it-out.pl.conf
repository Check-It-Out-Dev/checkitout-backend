# =============================================================================
# Test Site: check-it-out.pl
# /etc/nginx/sites-available/check-it-out.pl.conf
# =============================================================================

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name check-it-out.pl www.check-it-out.pl;
    
    # Rate limiting for redirect
    limit_req zone=general_limit burst=10 nodelay;
    
    return 301 https://check-it-out.pl$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.check-it-out.pl;

    # SSL configuration - MUST BE HERE for redirect to work!
    ssl_certificate /etc/letsencrypt/live/check-it-out.pl-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/check-it-out.pl-0002/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/check-it-out.pl-0002/chain.pem;

    return 301 https://check-it-out.pl$request_uri;
}

# Main test server
server {
    listen 443 ssl http2;
    server_name check-it-out.pl;
    root /var/www/check-it-out.pl;
    index index.html index.htm;

    # Access and error logs
    access_log /var/log/nginx/check-it-out.pl.access.log cloudflare;
    error_log /var/log/nginx/check-it-out.pl.error.log warn;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/check-it-out.pl-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/check-it-out.pl-0002/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/check-it-out.pl-0002/chain.pem;

    # Connection limits
    limit_conn conn_limit_per_ip 20;
    limit_conn conn_limit_per_server 500;

    # Block bad bots and referers
    if ($bad_bot) { return 403; }
    if ($bad_referer) { return 403; }

    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # Main location with authentication
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        
        # Authentication check for test environment
        auth_request /validate-session;
        error_page 401 = @error401;

        try_files $uri $uri/ /index.html;

        # CORS headers for OPTIONS requests
        if ($request_method = OPTIONS) {
            # Same as the .app copy: it can only echo the target host back at itself.
            add_header Access-Control-Allow-Origin "https://$host" always;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-CSRF-Token, X-App-Language, Accept-Language" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type text/plain;
            add_header Content-Length 0;
            return 204;
        }
    }

    # Session validation endpoint
    location = /validate-session {
        internal;
        limit_req zone=strict_limit burst=5;
        
        proxy_pass http://localhost:5000/validate_session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $real_ip;
    }

    # Login page
    location /login-tst {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://localhost:5000/login;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Error redirect to login
    location @error401 {
        # A same-host redirect to a fixed path; a browser only sends the Host it is visiting.
        return 302 https://$host/login-tst;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
    }

    # Special rate limiting for auth endpoints
    # burst=20 delegates security policy to application layer (5 attempts)
    # nginx only protects against flood attacks (>20 rapid requests)
    location ~ ^/api/(login|auth|register) {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://localhost:8082;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # OAuth callback endpoints (no additional rate limiting)
    location ~ ^/api/auth/social/callback/ {
        proxy_pass http://localhost:8082;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Support ticket creation - specific rate limiting
    location ~ ^/api/support/ticket$ {
        limit_req zone=support_limit burst=10 nodelay;
        proxy_pass http://localhost:8082;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # API location - proxy to Spring Boot backend (TEST)
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://localhost:8082;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Health check endpoint (for monitoring)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Static files with caching
    location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
