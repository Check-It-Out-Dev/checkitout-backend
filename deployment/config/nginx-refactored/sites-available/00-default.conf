# =============================================================================
# Default Server Block
# /etc/nginx/sites-available/00-default.conf
# 
# Catches all requests that don't match any other server block
# Blocks direct IP access and unconfigured domains
# =============================================================================

# Default server block - catch all for direct IP access
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    
    server_name _;
    
    # Self-signed certificate for default block (create these)
    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;
    
    # Close connection without response
    return 444;
    
    # Log attempts to access via IP (optional)
    access_log /var/log/nginx/default.access.log;
    error_log /var/log/nginx/default.error.log;
}

# Health check server (optional - for load balancer health checks)
server {
    listen 127.0.0.1:8888;
    server_name localhost;
    
    location /nginx-health {
        access_log off;
        return 200 "nginx is healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
