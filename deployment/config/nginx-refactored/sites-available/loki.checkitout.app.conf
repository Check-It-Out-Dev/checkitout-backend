# =============================================================================
# Loki API with mTLS Authentication: loki.checkitout.app
# /etc/nginx/sites-available/loki.checkitout.app.conf
# 
# Production-grade secure mTLS configuration with 2025 best practices
# Compatible with nginx 1.24
# =============================================================================

# Note: The $ssl_client_s_dn_cn variable is extracted in the main nginx.conf
# using: map $ssl_client_s_dn $ssl_client_s_dn_cn { ... }

# Map to authorize specific client certificate CNs
map $ssl_client_s_dn_cn $authorized_client {
    default 0;
    "grafana-cloud@CheckItOut" 1;
    "alloy@CheckItOut" 1;
}

# Upstream for Loki
upstream loki_backend {
    server localhost:3100 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 75s;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name loki.checkitout.app;
    
    # Security headers even for redirects
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Rate limiting for redirect
    limit_req zone=general_limit burst=10 nodelay;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server with mTLS authentication
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loki.checkitout.app;
    
    # Logging
    access_log /var/log/nginx/loki.checkitout.app.access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/loki.checkitout.app.error.log warn;
    
    # SSL certificates
    ssl_certificate /etc/nginx/certs/loki/server/loki-server-chain.crt;
    ssl_certificate_key /etc/nginx/certs/loki/server/loki-server.key;
    
    # Disable OCSP stapling for self-signed certificates
    ssl_stapling off;
    ssl_stapling_verify off;
    
    # mTLS Client Certificate Authentication
    ssl_client_certificate /etc/nginx/certs/loki/ca/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    
    # SSL session settings (override global if needed)
    ssl_session_cache shared:SSL_LOKI:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Connection limits
    limit_conn conn_limit_per_ip 50;
    limit_conn conn_limit_per_server 1000;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;  # Disabled in modern browsers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # Remove server version
    server_tokens off;
    # more_clear_headers Server;  # Uncomment if you have headers-more module
    
    # Client body settings for log ingestion
    client_body_buffer_size 1M;
    client_max_body_size 100M;
    client_body_timeout 60s;
    
    # Timeouts optimized for log streaming
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    
    # =========================================================================
    # Health check endpoints (allow without cert from internal)
    # =========================================================================
    location ~ ^/(ready|metrics)$ {
        # Allow internal access without certificate
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        # Loki is behind mTLS and reads no Host; see the note in conf.d/proxy-params.conf.
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Connection "";
        
        # Don't log health checks
        access_log off;
    }
    
    # =========================================================================
    # Loki Push endpoint (write path) - authorization check
    # =========================================================================
    location = /loki/api/v1/push/auth {
        internal;
        
        # Check authorization based on client certificate
        if ($authorized_client != 1) {
            return 403 "Unauthorized client certificate";
        }
        
        return 200;
    }
    
    # =========================================================================
    # Loki Push endpoint (write path)
    # =========================================================================
    location = /loki/api/v1/push {
        # First check authorization
        auth_request /loki/api/v1/push/auth;
        error_page 403 = @cert_unauthorized;
        
        # Rate limiting disabled - mTLS provides access control
        # limit_req zone=loki_push_limit burst=50 nodelay;
        # limit_req_status 429;
        
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        
        # Important headers
        # Same reason as the first of these in this file.
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Informational, and unread.
        proxy_set_header X-Forwarded-Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Client certificate info headers (for logging/debugging)
        proxy_set_header X-SSL-Client-CN $ssl_client_s_dn_cn;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        
        # Keep-alive
        proxy_set_header Connection "";
        
        # Disable buffering for real-time push
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Increase buffer sizes for large batches
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
    
    # =========================================================================
    # Loki Query endpoints authorization check
    # =========================================================================
    location = /loki/api/v1/query/auth {
        internal;
        
        # Check authorization based on client certificate
        if ($authorized_client != 1) {
            return 403 "Unauthorized client certificate";
        }
        
        return 200;
    }
    
    # =========================================================================
    # Loki Query endpoints (read path)
    # =========================================================================
    location ~ ^/loki/api/v1/(query|query_range|series|labels|label/[^/]+/values|index/stats|tail)$ {
        # First check authorization
        auth_request /loki/api/v1/query/auth;
        error_page 403 = @cert_unauthorized;
        
        # Rate limiting disabled - mTLS provides access control
        # limit_req zone=loki_query_limit burst=30 nodelay;
        # limit_req_status 429;
        
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        
        # Headers
        # Same reason as the first of these in this file.
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Client certificate info
        proxy_set_header X-SSL-Client-CN $ssl_client_s_dn_cn;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        
        # Enable buffering for queries
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
        
        # Cache headers for query results (1 minute)
        proxy_cache_valid 200 1m;
        proxy_cache_bypass $http_pragma $http_cache_control;
        proxy_no_cache $http_pragma $http_cache_control;
    }
    
    # =========================================================================
    # Config endpoint (read-only)
    # =========================================================================
    location = /config {
        # Client certificate verification handled at server level
        # Additional check via variable
        set $cert_check "";
        if ($ssl_client_verify != "SUCCESS") {
            set $cert_check "FAIL";
        }
        if ($cert_check = "FAIL") {
            return 403 "Client certificate required";
        }
        
        # Read-only
        limit_except GET HEAD {
            deny all;
        }
        
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        # Same reason as the first of these in this file.
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Connection "";
    }
    
    # =========================================================================
    # Admin endpoints (restricted)
    # =========================================================================
    location ~ ^/(flush|shutdown|services|memberlist|ring|delete)$ {
        # Strict access control
        allow 127.0.0.1;
        deny all;
        
        proxy_pass http://loki_backend;
        proxy_http_version 1.1;
        # Same reason as the first of these in this file.
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Connection "";
    }
    
    # =========================================================================
    # API documentation
    # =========================================================================
    location = /api/docs {
        default_type text/html;
        return 200 '<html><head><meta http-equiv="refresh" content="0;url=https://grafana.com/docs/loki/latest/api/"/></head></html>';
    }
    
    # =========================================================================
    # Root endpoint - API info
    # =========================================================================
    location = / {
        # Basic info available without client cert from internal only
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        
        default_type application/json;
        return 200 '{
            "service": "loki",
            "version": "3.5.3",
            "auth": "mTLS (client certificate required)",
            "endpoints": {
                "push": "/loki/api/v1/push",
                "query": "/loki/api/v1/query",
                "ready": "/ready",
                "metrics": "/metrics"
            },
            "docs": "https://grafana.com/docs/loki/latest/",
            "timestamp": "$time_iso8601"
        }\n';
    }
    
    # =========================================================================
    # Deny everything else
    # =========================================================================
    location / {
        deny all;
        return 404;
    }
    
    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 495 = @cert_error;
    error_page 496 = @cert_required;
    error_page 497 = @http_to_https;
    
    location @cert_error {
        default_type application/json;
        return 495 '{"error":"Invalid client certificate","code":495}\n';
    }
    
    location @cert_required {
        default_type application/json;
        return 496 '{"error":"Client certificate required","code":496}\n';
    }
    
    location @cert_unauthorized {
        default_type application/json;
        return 403 '{"error":"Unauthorized client certificate","code":403}\n';
    }
    
    location @http_to_https {
        return 301 https://$server_name$request_uri;
    }
}
