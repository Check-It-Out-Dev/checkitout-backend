# =============================================================================
# Production Site: checkitout.app
# /etc/nginx/sites-available/checkitout.app.conf
# =============================================================================

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name checkitout.app www.checkitout.app;
    
    # Rate limiting for redirect
    limit_req zone=general_limit burst=10 nodelay;
    
    return 301 https://checkitout.app$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.checkitout.app;

    # SSL configuration - MUST BE HERE for redirect to work!
    ssl_certificate /etc/letsencrypt/live/checkitout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkitout.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/checkitout.app/chain.pem;

    return 301 https://checkitout.app$request_uri;
}

# Main production server
server {
    listen 443 ssl http2;
    server_name checkitout.app;
    root /var/www/checkitout.app;
    index index.html index.htm;

    # Access and error logs
    access_log /var/log/nginx/checkitout.app.access.log cloudflare;
    error_log /var/log/nginx/checkitout.app.error.log warn;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/checkitout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkitout.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/checkitout.app/chain.pem;

    # Connection limits
    limit_conn conn_limit_per_ip 20;
    limit_conn conn_limit_per_server 1000;

    # Block bad bots and referers
    if ($bad_bot) { return 403; }
    if ($bad_referer) { return 403; }

    # Security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # Main location
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;

        # CORS headers for OPTIONS requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://$host" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-CSRF-Token, X-App-Language, Accept-Language" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type text/plain;
            add_header Content-Length 0;
            return 204;
        }
    }

    # Special rate limiting for auth endpoints
    # burst=20 allows application layer to enforce security policy (5 attempts)
    # while nginx only blocks obvious floods (>20 rapid requests)
    location ~ ^/api/(login|auth|register) {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://localhost:8083;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # OAuth callback endpoints (no additional rate limiting)
    location ~ ^/api/auth/social/callback/ {
        proxy_pass http://localhost:8083;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Support ticket creation - specific rate limiting
    location ~ ^/api/support/ticket$ {
        limit_req zone=support_limit burst=10 nodelay;
        proxy_pass http://localhost:8083;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # API location - proxy to Spring Boot backend
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://localhost:8083;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Health check endpoint (for monitoring)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Static files with caching
    location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
