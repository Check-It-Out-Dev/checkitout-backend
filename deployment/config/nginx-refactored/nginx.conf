# =============================================================================
include /etc/nginx/modules-enabled/*.conf;
# Main Nginx Configuration
# /etc/nginx/nginx.conf
# 
# This is the main configuration file that includes all modular components
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Worker configuration
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    # =========================================================================
    # Basic Settings
    # =========================================================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    
    types_hash_max_size 2048;
    server_tokens off;
    server_names_hash_bucket_size 64;
    server_name_in_redirect off;
    
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # =========================================================================
    # Map directive for extracting CN from client certificate DN
    # Required for Loki mTLS authentication
    # =========================================================================
    map $ssl_client_s_dn $ssl_client_s_dn_cn {
        default "";
        ~CN=([^,]+) $1;
    }
    
    # =========================================================================
    # MIME Types
    # =========================================================================
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # =========================================================================
    # Logging Settings
    # =========================================================================
    
    # Default log format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    
    access_log /var/log/nginx/access.log main;
    
    # =========================================================================
    # Include Modular Configuration Files
    # =========================================================================
    
    # IMPORTANT: Order matters for some includes
    # 6. Any additional configuration files
    include /etc/nginx/conf.d/*.conf;
    
    # =========================================================================
    # Virtual Host Configs (Server Blocks)
    # =========================================================================
    
    # Include all enabled sites
    # Note: Create symlinks from sites-available to sites-enabled for active sites
    include /etc/nginx/sites-enabled/*;
    
    # Alternative: If not using sites-enabled symlinks, include directly:
    # include /etc/nginx/sites-available/*.conf;
}

# =============================================================================
# Additional Contexts (if needed)
# =============================================================================

