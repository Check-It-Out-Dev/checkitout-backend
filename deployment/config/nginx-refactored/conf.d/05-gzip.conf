# =============================================================================
# Gzip Compression Configuration
# /etc/nginx/conf.d/05-gzip.conf
# 
# Compression settings for better performance
# =============================================================================

# Enable gzip compression
gzip on;

# Gzip settings
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_disable "msie6";

# Gzip types - compress these MIME types
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    text/cache-manifest
    application/json
    application/javascript
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/ld+json
    application/manifest+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    font/opentype
    image/svg+xml
    image/x-icon
    image/vnd.microsoft.icon;

# Note: Don't compress already compressed formats like jpg, png, pdf, etc.
