# =============================================================================
# SSL Configuration
# /etc/nginx/conf.d/04-ssl.conf
# 
# SSL/TLS settings for secure connections
# =============================================================================

# SSL Protocols - Only TLS 1.2 and 1.3
ssl_protocols TLSv1.2 TLSv1.3;

# SSL Ciphers - Modern configuration
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Prefer server ciphers
ssl_prefer_server_ciphers off;

# SSL session cache
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolver for OCSP stapling (Cloudflare, Google)
resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# SSL buffer size (optimized for modern connections)
ssl_buffer_size 4k;

# Diffie-Hellman parameters
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

# SSL early data (0-RTT) - disabled for security
ssl_early_data off;
