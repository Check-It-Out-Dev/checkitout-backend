# =============================================================================
# Proxy Parameters
# /etc/nginx/conf.d/proxy-params.conf
# 
# Common proxy settings for backend connections
# Usage: include /etc/nginx/conf.d/proxy-params.conf;
# =============================================================================

# Basic proxy headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $real_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Cloudflare specific headers
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header CF-IPCountry $http_cf_ipcountry;
proxy_set_header CF-RAY $http_cf_ray;
proxy_set_header CF-Visitor $http_cf_visitor;

# Additional tracking headers
proxy_set_header X-Original-Host $host;
proxy_set_header X-Original-Scheme $scheme;
proxy_set_header X-Nginx-Proxy true;
proxy_set_header X-Request-ID $request_id;

# Language preference header (user's explicit UI choice, passed from frontend)
proxy_set_header X-App-Language $http_x_app_language;

# WebSocket support
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer settings
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;
proxy_temp_file_write_size 64k;

# Disable buffering for SSE (Server-Sent Events)
proxy_buffering off;

# Handle backend errors gracefully
proxy_intercept_errors on;

# Preserve host for backend
proxy_set_header X-Forwarded-Server $host;

# SECURITY (pentest 3.10/3.11): the backend (Spring Security defaults) emits
# its own X-Frame-Options: DENY and X-XSS-Protection: 0. nginx already sets
# security headers itself (security-headers.conf, add_header ... always) and
# APPENDS rather than replaces upstream headers — producing a duplicated
# X-Frame-Options and a conflicting X-XSS-Protection on proxied /api responses.
# Strip the upstream copies so X-Frame-Options has a single source (nginx's
# DENY) and X-XSS-Protection is absent entirely (the deprecated header).
proxy_hide_header X-Frame-Options;
proxy_hide_header X-XSS-Protection;