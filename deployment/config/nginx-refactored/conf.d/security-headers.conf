# =============================================================================
# Security Headers Include File
# /etc/nginx/conf.d/security-headers.conf
# 
# Include this file in server blocks to add security headers
# Usage: include /etc/nginx/conf.d/security-headers.conf;
# =============================================================================

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# X-XSS-Protection deliberately NOT set (pentest 3.11): the legacy filter is
# deprecated and ignored/harmful in modern browsers. Removed here; the
# backend's own value is stripped in proxy-params.conf so the header is gone.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy $content_security_policy always;
add_header Permissions-Policy $permissions_policy always;

# Additional security headers
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;
add_header X-DNS-Prefetch-Control "off" always;

# Remove sensitive headers (requires headers_more module)
# more_clear_headers Server;
# more_clear_headers X-Powered-By;
