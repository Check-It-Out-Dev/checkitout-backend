# =============================================================================
# Rate Limiting Configuration
# /etc/nginx/conf.d/02-rate-limiting.conf
# 
# Defines rate limiting zones and connection limits
# =============================================================================

# Rate limiting zones
# CRITICAL: Use $real_ip (from 01-cloudflare.conf) instead of $binary_remote_addr
# When behind Cloudflare, $binary_remote_addr would be the edge server IP,
# causing ALL users to share the same rate limit bucket!
# $real_ip contains the actual client IP from CF-Connecting-IP header
limit_req_zone $real_ip zone=general_limit:10m rate=30r/s;
limit_req_zone $real_ip zone=api_limit:10m rate=30r/s;
limit_req_zone $real_ip zone=login_limit:10m rate=20r/m;
limit_req_zone $real_ip zone=upload_limit:10m rate=15r/m;
limit_req_zone $real_ip zone=strict_limit:10m rate=1r/s;
limit_req_zone $real_ip zone=support_limit:10m rate=5r/m;  # 1 per minute = 60/hour (app enforces 15/hour)

# Connection limiting zones
# Also use $real_ip to properly track connections per actual client
limit_conn_zone $real_ip zone=conn_limit_per_ip:10m;
limit_conn_zone $server_name zone=conn_limit_per_server:10m;

# Rate limiting status codes
limit_req_status 429;
limit_conn_status 429;

# Log format for rate limited requests
log_format ratelimited '$real_ip - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'Rate-Limited: YES';
