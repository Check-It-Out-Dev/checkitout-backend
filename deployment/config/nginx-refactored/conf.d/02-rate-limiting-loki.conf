# =============================================================================
# Rate Limiting Configuration for Loki
# /etc/nginx/conf.d/02-rate-limiting-loki.conf
# 
# Specific rate limiting zones for Loki API endpoints
# This extends the main rate limiting configuration
# =============================================================================

# Rate limiting for Loki push operations (log ingestion)
# Higher limits as logs are sent in batches
limit_req_zone $binary_remote_addr zone=loki_push_limit:10m rate=10r/s;

# Rate limiting for Loki query operations
# More restrictive as queries can be expensive
limit_req_zone $binary_remote_addr zone=loki_query_limit:10m rate=30r/s;

# Rate limiting for Loki admin operations
# Very restrictive
limit_req_zone $binary_remote_addr zone=loki_admin_limit:5m rate=1r/s;

# Connection limits for Loki
limit_conn_zone $binary_remote_addr zone=loki_conn_limit:10m;

# Note: limit_req_status and limit_conn_status are set globally in main rate limiting config