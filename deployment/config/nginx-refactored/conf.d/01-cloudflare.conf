# =============================================================================
# Cloudflare IP Configuration
# /etc/nginx/conf.d/01-cloudflare.conf
# 
# This file contains all Cloudflare-related configurations including:
# - Cloudflare IP ranges (updated automatically via cron)
# - Real IP detection settings
# - Cloudflare-specific mappings
# 
# Auto-update: This file can be regenerated by update-cloudflare-ips.sh
# Last manual update: January 2025
# =============================================================================

# Cloudflare IP ranges (IPv4)
# Source: https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IP ranges (IPv6)
# Source: https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use CF-Connecting-IP header for real IP
real_ip_header CF-Connecting-IP;

# Trust proxies recursively
real_ip_recursive on;

# Map to get real IP from Cloudflare
map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

# Cloudflare-specific log format
log_format cloudflare '$real_ip - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'CF-Ray: $http_cf_ray CF-Country: $http_cf_ipcountry '
                     'CF-Visitor: $http_cf_visitor';

# Map for Cloudflare visitor scheme (HTTP/HTTPS)
map $http_cf_visitor $cf_scheme {
    default $scheme;
    "~*https" https;
    "~*http" http;
}
