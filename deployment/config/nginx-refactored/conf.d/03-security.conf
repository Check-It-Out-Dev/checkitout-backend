# =============================================================================
# Security Configuration
# /etc/nginx/conf.d/03-security.conf
# 
# Security headers, bot blocking, and other security-related settings
# =============================================================================

# Map for blocking bad user agents
map $http_user_agent $bad_bot {
    default 0;
    ~*^$ 1;
    ~*(wget|curl|libwww-perl|python|nikto|scan|sqlmap) 1;
    ~*(jorgee|morfeus|fuck|shit|havij|appscan|nessus|nmap) 1;
    ~*(masscan|wpscan|joomscan|golismero|owasp|dirbuster) 1;
    ~*(acunetix|burpsuite|openvas|qualys|nexpose) 1;
}

# Map for blocking bad referers
map $http_referer $bad_referer {
    default 0;
    ~*(babes|click|diamond|forsale|girl|jewelry|love|nudit|organic|poker|porn|sex|teen|webcam|zippo) 1;
    ~*(casino|replica|gambling|poker|cheap|discount|pills|medication) 1;
    ~*(adult|dating|erotic|escort) 1;
}

# Security headers to be included in server blocks
# Note: These are defined here but must be added in each server block
# Use: include /etc/nginx/conf.d/security-headers.conf;

# Map for security headers (can be overridden per location)
map $sent_http_content_type $content_security_policy {
    default "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.cloudflare.com https://cdnjs.cloudflare.com https://f.vimeocdn.com https://www.instagram.com https://www.googletagmanager.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://player.vimeo.com https://www.instagram.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'none';";
}

map $sent_http_content_type $x_frame_options {
    default "DENY";
}

map $sent_http_content_type $permissions_policy {
    default "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()";
}
