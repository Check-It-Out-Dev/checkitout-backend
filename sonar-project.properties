# SonarQube Cloud project configuration. Free for public repositories.
#
# The key and organisation follow SonarCloud's own convention for a GitHub import
# (<org>_<repo> and the lower-cased org), so importing this repository through the UI produces
# exactly these values and nothing here has to be edited afterwards.
sonar.projectKey=Check-It-Out-Dev_checkitout-backend
sonar.organization=check-it-out-dev
sonar.projectName=checkItOut backend

sonar.sources=src/main
sonar.tests=src/test
sonar.java.source=21
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.sourceEncoding=UTF-8

# Written by the unit tier in the workflow; Sonar reads coverage rather than measuring it.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco-unit/jacoco.xml,target/site/jacoco-e2e/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Generated, vendored or non-source, in that order. Excluding them is not hiding debt: a duplication
# or complexity score computed over a generated OpenAPI client measures the generator, not this
# codebase, and the Liquibase changelogs are a migration history that must never be edited.
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/generated/**,\
  src/main/resources/db/changelog/**,\
  src/main/resources/static/**,\
  src/main/resources/templates/**

# Test code is analysed, but with the rules that suit tests: a hard-coded string in a fixture is
# the point of the fixture.
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/*Application.java
