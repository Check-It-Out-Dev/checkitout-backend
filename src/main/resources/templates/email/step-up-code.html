<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:text="#{email.step_up_code.title}">Verification Code</title>
    <!--[if mso]>
    <style>
        table { border-collapse: collapse; }
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.6; color: #333333; background-color: #f4f4f4;">

    <!-- Wrapper table for background color -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f4f4f4;">
        <tr>
            <td style="padding: 20px 0;">
                <!-- Container table (mobile responsive) -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 0 auto; max-width: 600px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" align="center">

                    <!-- Header Section -->
                    <tr>
                        <td style="background-color: #667eea; padding: 40px 20px; text-align: center; color: #ffffff; border-radius: 8px 8px 0 0;">
                            <!--[if mso]>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                            <tr>
                            <td style="background-color: #667eea; padding: 40px 20px; text-align: center;">
                            <![endif]-->
                            <h1 style="margin: 0; padding: 0; font-size: 24px; font-weight: 600; color: #ffffff;" th:text="#{email.step_up_code.title}">Verification Code</h1>
                            <!--[if mso]>
                            </td>
                            </tr>
                            </table>
                            <![endif]-->
                        </td>
                    </tr>

                    <!-- Body Section -->
                    <tr>
                        <td style="padding: 40px 30px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">

                                <!-- Greeting -->
                                <tr>
                                    <td style="padding-bottom: 20px;">
                                        <h2 style="margin: 0; padding: 0; font-size: 22px; font-weight: 600; color: #667eea;" th:text="#{email.step_up_code.greeting(${userName})}">Hi User,</h2>
                                    </td>
                                </tr>

                                <!-- Message -->
                                <tr>
                                    <td style="padding-bottom: 20px; font-size: 16px; color: #555555; line-height: 1.6;" th:text="#{email.step_up_code.message}">
                                        Your verification code is:
                                    </td>
                                </tr>

                                <!-- Code Display -->
                                <tr>
                                    <td style="padding: 20px 0; text-align: center;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px;">
                                            <tr>
                                                <td style="padding: 24px; text-align: center;">
                                                    <span style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #667eea; font-family: 'Courier New', Courier, monospace;" th:text="${verificationCode}">123456</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Expiry note -->
                                <tr>
                                    <td style="padding-top: 10px; font-size: 14px; color: #6c757d; line-height: 1.5;">
                                        <strong th:text="#{email.step_up_code.expiry}">This code expires in 10 minutes.</strong>
                                    </td>
                                </tr>

                                <!-- Warning -->
                                <tr>
                                    <td style="padding-top: 10px; font-size: 14px; color: #6c757d; line-height: 1.5;" th:text="#{email.step_up_code.warning}">
                                        If you didn't request this code, you can safely ignore this email.
                                    </td>
                                </tr>

                            </table>
                        </td>
                    </tr>

                    <!-- Footer Section -->
                    <tr>
                        <td style="background-color: #f8f9fa; padding: 30px; text-align: center; border-top: 1px solid #e9ecef; border-radius: 0 0 8px 8px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td style="padding-bottom: 8px;">
                                        <span style="color: #667eea; font-weight: 600; font-size: 14px;" th:text="#{email.common.footer.company}">CheckItOut Team</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-bottom: 8px; font-size: 14px; color: #6c757d;">
                                        <span th:text="#{email.common.footer.contact_prefix}">Need help? Contact us at</span>
                                        <a href="mailto:support@example.com" style="color: #667eea; text-decoration: none;">support@example.com</a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-top: 10px; font-size: 13px; color: #999999;">
                                        <span>&copy; </span><span th:text="${currentYear}">2026</span><span> Check It Out. </span><span th:text="#{email.common.footer.rights}">All rights reserved.</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
