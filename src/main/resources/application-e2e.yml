# =============================================================================
# E2E TEST PROFILE - CUCUMBER BDD WITH REAL REDIS
# =============================================================================
# This profile is used for end-to-end integration tests with Cucumber.
# Infrastructure (PostgreSQL, Redis) is provided by Testcontainers.
# Testcontainers will override datasource and redis properties via @DynamicPropertySource.

spring:
  # =============================================================================
  # DATASOURCE - TESTCONTAINERS WILL OVERRIDE
  # =============================================================================
  datasource:
    # Placeholder - overridden by TestContainersConfig @DynamicPropertySource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/checkitout_e2e
    username: test
    password: test

    hikari:
      pool-name: CheckItOut-E2E-Pool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  # =============================================================================
  # LIQUIBASE - RUN TEST CONTEXT MIGRATIONS
  # =============================================================================
  liquibase:
    enabled: true
    contexts: test
    # Use test database credentials
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}

  # =============================================================================
  # REDIS - TESTCONTAINERS WILL OVERRIDE
  # =============================================================================
  data:
    redis:
      enabled: true
      mode: standalone
      # Placeholder - overridden by TestContainersConfig @DynamicPropertySource
      host: localhost
      port: 6379
      password: ''
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 5m
      key-prefix: "checkitout:e2e:"

  # =============================================================================
  # EMAIL - GREENMAIL IN-MEMORY SMTP FOR E2E TESTS
  # =============================================================================
  # GreenMail starts on port 3025 via GreenMailConfig bean.
  # All emails sent by the application are captured in-memory for assertion.
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
            required: false

# =============================================================================
# DISABLE RECAPTCHA FOR E2E TESTS
# =============================================================================
recaptcha:
  enabled: false

# =============================================================================
# AUTH COOLDOWNS - DISABLED FOR E2E TESTS
# =============================================================================
auth:
  email-verification:
    cooldown-seconds: 0
  password-reset:
    cooldown-seconds: 0

# =============================================================================
# TOTP CONFIGURATION - ENABLED FOR TESTING REAL 2FA FLOW
# =============================================================================
totp:
  enabled: true
  issuer: CheckItOut-E2E

# =============================================================================
# SESSION CONFIGURATION - MUST BE SET VIA SYSTEM PROPERTIES (NO DEFAULTS)
# =============================================================================
# Fail-fast: No defaults - Spring fails if properties not provided.
# Pass via Maven argLine: -Dsession.full-duration-seconds=X
#
# Property NAME must match: session.full-duration-seconds (not SESSION_FULL_DURATION)
#
# Test suite configurations (in pom.xml argLine):
#   - normal-e2e: -Dsession.full-duration-seconds=604800 -Dsession.partial-duration-seconds=600
#   - session-expiry: -Dsession.full-duration-seconds=15 -Dsession.partial-duration-seconds=15
#   - multi-user: -Dsession.full-duration-seconds=604800 -Dsession.partial-duration-seconds=600
session:
  full-duration-seconds: ${FULLSESSION}
  admin-full-duration-seconds: ${ADMINSESSION:7200}
  partial-duration-seconds: ${PARTIALSESSION}

# =============================================================================
# E2E TEST USERS CONFIGURATION
# =============================================================================
e2e:
  test:
    enabled: true
  admin:
    firebase-uid: ${E2E_ADMIN_FIREBASE_UID:E2E_ADMIN_001}
    email: ${E2E_ADMIN_EMAIL:e2e.admin@test.com}
    totp-secret: ${E2E_ADMIN_TOTP_SECRET:}
  company:
    firebase-uid: ${E2E_COMPANY_FIREBASE_UID:E2E_COMPANY_001}
    email: ${E2E_COMPANY_EMAIL:e2e.company@test.com}
  influencer:
    firebase-uid: ${E2E_INFLUENCER_FIREBASE_UID:E2E_INFLUENCER_001}
    email: ${E2E_INFLUENCER_EMAIL:e2e.influencer@test.com}

# =============================================================================
# STORAGE MODE - USE REDIS
# =============================================================================
storage:
  mode: redis

# =============================================================================
# GEOIP CONFIGURATION - ENABLE GDPR CONTROLLER FOR E2E TESTS
# =============================================================================
geoip:
  cache:
    type: redis
  gdpr:
    enabled: true

# =============================================================================
# RATE LIMITING - MUST BE CONFIGURED VIA SYSTEM PROPERTIES (NO DEFAULTS)
# =============================================================================
# Fail-fast: No defaults - Spring fails if properties not provided.
# Pass via Maven argLine: -DRL_STANDARD_REQ=X -DRL_STANDARD_WIN=Y etc.
#
# Property NAME must match: RL_{PROFILE}_{REQ|WIN|BLOCK}
#
# Test suite configurations (in pom.xml argLine):
#   - normal-e2e:      RL_STANDARD_REQ=10000 (high limits - no interference)
#   - session-expiry:  RL_STANDARD_REQ=10000 (high limits - no interference)
#   - multi-user:      RL_STANDARD_REQ=10000 (high limits - no interference)
#   - rate-limiting:   RL_STANDARD_REQ=5     (low limits - test 429 responses)
rate-limit:
  enabled: true
  defaults:
    requests: 10000
    duration: 3600
    auth-requests: 100
    auth-duration: 60
  profiles:
    standard:
      requests: ${RL_STANDARD_REQ}
      window-seconds: ${RL_STANDARD_WIN}
      block-duration-seconds: ${RL_STANDARD_BLOCK}
    strict:
      requests: ${RL_STRICT_REQ}
      window-seconds: ${RL_STRICT_WIN}
      block-duration-seconds: ${RL_STRICT_BLOCK}
    relaxed:
      requests: ${RL_RELAXED_REQ}
      window-seconds: ${RL_RELAXED_WIN}
      block-duration-seconds: ${RL_RELAXED_BLOCK}
    high:
      requests: ${RL_HIGH_REQ}
      window-seconds: ${RL_HIGH_WIN}
      block-duration-seconds: ${RL_HIGH_BLOCK}
    auth:
      requests: ${RL_AUTH_REQ}
      window-seconds: ${RL_AUTH_WIN}
      block-duration-seconds: ${RL_AUTH_BLOCK}
    admin-auth:
      requests: ${RL_ADMIN_AUTH_REQ}
      window-seconds: ${RL_ADMIN_AUTH_WIN}
      block-duration-seconds: ${RL_ADMIN_AUTH_BLOCK}
    company-auth:
      requests: ${RL_COMPANY_AUTH_REQ}
      window-seconds: ${RL_COMPANY_AUTH_WIN}
      block-duration-seconds: ${RL_COMPANY_AUTH_BLOCK}
    influencer-auth:
      requests: ${RL_INFLUENCER_AUTH_REQ}
      window-seconds: ${RL_INFLUENCER_AUTH_WIN}
      block-duration-seconds: ${RL_INFLUENCER_AUTH_BLOCK}
    unknown-auth:
      requests: ${RL_UNKNOWN_AUTH_REQ}
      window-seconds: ${RL_UNKNOWN_AUTH_WIN}
      block-duration-seconds: ${RL_UNKNOWN_AUTH_BLOCK}

# =============================================================================
# ENVIRONMENT SETTINGS
# =============================================================================
app:
  environment: E2E_TEST

server:
  port: 0  # Random port for tests
  servlet:
    context-path: /api

# =============================================================================
# LOCAL DATABASE INITIALIZATION - DISABLED FOR E2E
# =============================================================================
local:
  db:
    init:
      enabled: false

# =============================================================================
# LOGGING - REDUCED FOR E2E TESTS
# =============================================================================
logging:
  level:
    root: WARN
    com.sm.instagram.platform: INFO
    com.sm.instagram.platform.e2e: DEBUG
    org.testcontainers: INFO
    io.cucumber: INFO
    org.hibernate.SQL: WARN
    liquibase: WARN

# =============================================================================
# CORS - ALLOW ALL FOR E2E TESTS
# =============================================================================
cors:
  allowed-origins:
    - "*"
  allowed-methods: "*"
  allowed-headers: "*"
  allow-credentials: false

# =============================================================================
# ADMIN CONFIGURATION - FROM .ENV + STARTUP CHECKS DISABLED
# =============================================================================
admin:
  check:
    enabled: false
  firebase:
    uid: ${ADMIN_FIREBASE_UID:}
  email: ${ADMIN_EMAIL:}

# =============================================================================
# FIREBASE CONFIGURATION - FROM .ENV (loaded by TestContainersConfig)
# =============================================================================
firebase:
  service:
    account:
      json:
        base64: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  project:
    id: check-it-out-47c50
  # Note: Firebase API key removed - now using service account OAuth Bearer token authentication
  validation:
    enabled: true
  admin:
    setup:
      enabled: false

# =============================================================================
# JWT AND COOKIE SECRETS - FROM .ENV
# =============================================================================
jwt:
  secret: ${JWT_SECRET:}
  cookie:
    domain: localhost
    secure: false

cookie:
  hmac:
    secret: ${COOKIE_HMAC_SECRET:}

# =============================================================================
# INSTAGRAM/META CONFIGURATION - FROM .ENV
# =============================================================================
instagram:
  client-id: ${INSTAGRAM_CLIENT_ID:}
  client:
    secret: ${INSTAGRAM_CLIENT_SECRET:}
  test-token: ${INSTAGRAM_TEST_TOKEN:}

meta:
  app-id: ${META_APP_ID:}
  app-secret: ${META_APP_SECRET:}

# =============================================================================
# GCP CONFIGURATION - FROM .ENV
# =============================================================================
gcp:
  project-id: check-it-out-47c50
  kms:
    enabled: true
    location: europe-central2
    key-ring: instagram-tokens
    key-name: token-encryption-key

redis:
  startup:
    test:
      enabled: false

# =============================================================================
# ACTUATOR - CONFIGURE HEALTH ENDPOINT FOR E2E
# =============================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      enabled: true
      show-details: always
      # Remove authentication requirement for E2E tests
      roles: []
      probes:
        enabled: true
      group:
        readiness:
          include: db,diskSpace
        liveness:
          include: ping
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    ping:
      enabled: true

notification:
  email:
    enabled: true
    cron: "0 0 3 29 2 *"
    batch-size: 100
