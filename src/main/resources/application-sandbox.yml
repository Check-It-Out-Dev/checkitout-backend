# =============================================================================
# SANDBOX — dev-lite on a public host, behind the persona guard
# =============================================================================
# Activated together with dev-lite (SPRING_PROFILES_ACTIVE=dev-lite,sandbox) on sandbox.checkitout.app.
# dev-lite is a simulator made for a laptop; this profile is what makes it safe to expose:
#   - POST /test/auth/mock-session admits only the personas below (SandboxPersonaPolicy, 403 otherwise)
#     and activates the persona's account at sign-in (the seed creates influencers IN_VALIDATION);
#   - every other /test/** helper answers 404 (SandboxGuardFilter);
#   - the actuator exposes health, info and prometheus only; the frontend's nginx proxies health alone;
#   - console logs are ECS JSON lines for Loki (logback-spring.xml, profile block "sandbox");
#   - uploads go to the mounted sink with a size cap; the host mounts a 2 GB image there.
# Rate limits stay as in application.yml: they are the sandbox's load ceiling by design.
# Design of record: the frontend repository's docs/ci/SANDBOX.md.
checkitout:
  sandbox:
    enabled: true
    personas:
      - email: company@checkitout.app
        role: COMPANY
      - email: test.influencer@test.com
        role: INFLUENCER

# The browser's origin, which dev-lite never had to think about. dev-lite allows loopback patterns because
# it is a simulator on a developer's laptop; on a public host that list matches nothing a visitor sends, so
# every POST from a real browser came back 403 "Invalid CORS request" while curl — which sends no Origin at
# all — sailed through the smoke checks. The sandbox is served from https://checkitout.app/sandbox/ (the old
# hostname redirects there and is kept for links already in the wild). The loopback patterns are cleared:
# on a public host a page at http://localhost:anything is not a boundary worth honouring.
cors:
  allowed-origin-patterns: []
  allowed-origins:
    - https://checkitout.app
    - https://www.checkitout.app
    - https://sandbox.checkitout.app

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # The registry is on the classpath but exported only where a profile asks (dev leaves it off): Alloy
  # scrapes /actuator/prometheus on the internal network, so the sandbox asks.
  prometheus:
    metrics:
      export:
        enabled: true

file-upload:
  local-sink:
    dir: /data/uploads
  # Half of production's 10MB. The sandbox is a public demo whose only upload is a profile picture or
  # a campaign photo, so it does not need production's headroom, and every megabyte of it is buffered
  # for anyone who finds the URL (java:S5693). The application's own limit is set alongside the
  # container's so an oversized file is refused with a message rather than by the servlet.
  max-file-size: 5242880

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
