# =============================================================================
# E2E TEST PROFILE - OVERRIDE BASE TEST PROPERTIES
# =============================================================================
# The base test properties (application.properties) has spring.liquibase.enabled=false
# for unit tests. E2E tests need Liquibase to run to seed reference data.
# This file OVERRIDES the base when @ActiveProfiles("e2e") is active.
#
# Property Resolution Order (Spring Boot):
# 1. application.properties (base - has liquibase=false for unit tests)
# 2. application-e2e.properties (this file - OVERRIDES base for E2E profile)
#
# See: https://www.baeldung.com/spring-tests-override-properties

# =============================================================================
# LIQUIBASE - ENABLE FOR E2E TESTS
# =============================================================================
spring.liquibase.enabled=true
spring.liquibase.contexts=test
spring.liquibase.change-log=classpath:db/changelog/changelog.xml

# =============================================================================
# JPA/HIBERNATE - USE POSTGRESQL (NOT H2)
# =============================================================================
# E2E uses real PostgreSQL via Testcontainers
# Database URL is set dynamically by TestContainersConfig via System.setProperty
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# LOGGING - ENABLE LIQUIBASE DEBUG FOR E2E
# =============================================================================
logging.level.liquibase=INFO
logging.level.liquibase.changelog=DEBUG

# =============================================================================
# PAYMENTS TOGGLE
# =============================================================================
# E2E suite defaults to payments ON. The payments-off fork suite overrides
# via -Dapp.payments.enabled=false in its Failsafe <argLine> — system
# properties have higher precedence than this .properties file, so the
# override wins without needing a ${placeholder} indirection (which would
# create a circular reference against itself).
app.payments.enabled=true
