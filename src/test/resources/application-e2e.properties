# =============================================================================
# E2E TEST PROFILE - OVERRIDE BASE TEST PROPERTIES
# =============================================================================
# The base test properties (application.properties) has spring.liquibase.enabled=false
# for unit tests. E2E tests need Liquibase to run to seed reference data.
# This file OVERRIDES the base when @ActiveProfiles("e2e") is active.
#
# Property Resolution Order (Spring Boot):
# 1. application.properties (base - has liquibase=false for unit tests)
# 2. application-e2e.properties (this file - OVERRIDES base for E2E profile)
#
# See: https://www.baeldung.com/spring-tests-override-properties

# =============================================================================
# LIQUIBASE - ENABLE FOR E2E TESTS
# =============================================================================
spring.liquibase.enabled=true
spring.liquibase.contexts=test
spring.liquibase.change-log=classpath:db/changelog/changelog.xml

# =============================================================================
# JPA/HIBERNATE - USE POSTGRESQL (NOT H2)
# =============================================================================
# E2E uses real PostgreSQL via Testcontainers
# Database URL is set dynamically by TestContainersConfig via System.setProperty
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# =============================================================================
# LOGGING - ENABLE LIQUIBASE DEBUG FOR E2E
# =============================================================================
logging.level.liquibase=INFO
logging.level.liquibase.changelog=DEBUG

# =============================================================================
# PAYMENTS TOGGLE
# =============================================================================
# E2E suite defaults to payments ON. The payments-off fork suite overrides
# via -Dapp.payments.enabled=false in its Failsafe <argLine> — system
# properties have higher precedence than this .properties file, so the
# override wins without needing a ${placeholder} indirection (which would
# create a circular reference against itself).
app.payments.enabled=true

# =============================================================================
# SYNTHETIC SIGNING SECRETS FOR THE CREDENTIAL-FREE SUITE
# =============================================================================
# application-e2e.yml (main resources) deliberately blanks these two:
#   jwt.secret: ${JWT_SECRET:}        cookie.hmac.secret: ${COOKIE_HMAC_SECRET:}
# so a real deployment on the e2e profile cannot start with a default key.
# An empty key makes JwtTokenProvider.getSigningKey throw WeakKeyException
# ("0 bits"), which breaks /test/auth/mock-session — the credential-free login
# every scenario uses, including the ones that never touch Firebase.
# These values are synthetic, 32 bytes, and public on purpose: they sign
# nothing outside the test JVM. Real secrets still arrive from the environment,
# which overrides these.
jwt.secret=${JWT_SECRET:e2e-synthetic-jwt-secret-0123456789abcdef0123456789abcdef}
cookie.hmac.secret=${COOKIE_HMAC_SECRET:e2e-synthetic-hmac-secret-0123456789abcdef0123456789abcdef}

# =============================================================================
# THE FIREBASE EMULATOR IS THE IDENTITY PROVIDER FOR THIS TIER
# =============================================================================
# The suite used to sign in against a real Firebase project, which meant the tier could only ever be
# green on a machine holding a service-account key - so it was red on every public runner, and the
# admin's credentials were written into the Gherkin corpus of a public repository to make it work.
#
# It now runs against the Firebase Auth and Firestore emulators. Start them with:
#   firebase emulators:start --only auth,firestore --project demo-checkitout
# and export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 and FIRESTORE_EMULATOR_HOST=127.0.0.1:8080.
# The Admin SDK picks both up by itself; FirebaseEmulator redirects the Identity Toolkit calls this
# application makes by hand. FirebaseEmulatorSeeder creates the three actors at context start.
#
# Cloud KMS has no emulator, so the TOTP secret is encrypted with a local key instead. This is a real
# AES-GCM cipher, not a bypass, but the key is in this file: it protects nothing outside a test run,
# which is the only place gcp.kms.enabled is false.
gcp.kms.enabled=false
totp.local-key=e2e-local-totp-key-not-a-secret

# The three actors, matching the defaults in application-e2e.yml and the names in the feature files.
e2e.seed.password=e2e-emulator-password
# A base32 TOTP secret; the suite generates codes from the same value through TotpCodeGenerator.
e2e.admin.totp-secret=JBSWY3DPEHPK3PXP

# A demo project: the emulator treats any id beginning with "demo-" as needing no real project, and this
# is also what the synthetic offline credentials now carry, so the accounts the seeder writes and the
# accounts the application signs in against land in the same emulator store.
firebase.project.id=demo-checkitout
gcp.project-id=demo-checkitout

# Uploads go to LocalUploadSink, not to a GCS signed URL: a run with no Google credential gets 403 on the
# PUT and 507 on the confirm. The sink mirrors signed-URL semantics (single-use expiring token, size
# ceiling), so the scenarios still assert the same behaviour.
file-upload.local-sink.dir=./target/e2e-storage
