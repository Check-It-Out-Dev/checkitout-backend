# =============================================================================
# TEST CONFIGURATION - BASE TEST PROPERTIES
# =============================================================================
# The .env file is automatically loaded by spring-dotenv at startup
# All ${VARIABLE_NAME} references will be resolved from .env file
# Profile is set by @ActiveProfiles("test") in BaseTest.java

# =============================================================================
# DATABASE CONFIGURATION - H2 IN-MEMORY
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA/Hibernate configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Liquibase for unit tests
spring.liquibase.enabled=false

# =============================================================================
# DOTENV CONFIGURATION
# =============================================================================
# spring-dotenv automatically loads .env file from project root
# No additional configuration needed - it just works!
# Variables are available as ${VARIABLE_NAME} in properties

# =============================================================================
# FIREBASE CONFIGURATION - FROM .ENV
# =============================================================================
# Service account JSON loaded from .env file (base64 encoded)
firebase.service.account.json.base64=${FIREBASE_SERVICE_ACCOUNT_JSON}
firebase.project.id=check-it-out-47c50
# Note: Firebase API key removed - now using service account OAuth Bearer token authentication

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken%40system.gserviceaccount.com

# JWT Secret from .env
jwt.secret=${JWT_SECRET}
jwt.cookie.domain=localhost
jwt.cookie.secure=false

# Cookie HMAC Secret from .env
cookie.hmac.secret=${COOKIE_HMAC_SECRET}

# =============================================================================
# META/INSTAGRAM CONFIGURATION - FROM .ENV
# =============================================================================
meta.app-id=${META_APP_ID}
meta.app-secret=${META_APP_SECRET}
instagram.client-id=${INSTAGRAM_CLIENT_ID}
instagram.client.secret=${INSTAGRAM_CLIENT_SECRET}
instagram.test.token=${INSTAGRAM_TEST_TOKEN}

# =============================================================================
# ADMIN CONFIGURATION - FROM .ENV
# =============================================================================
admin.firebase.uid=${ADMIN_FIREBASE_UID}
admin.email=${ADMIN_EMAIL}

# =============================================================================
# MAXMIND CONFIGURATION - FROM .ENV
# =============================================================================
maxmind.license.key=${MAXMIND_LICENSE_KEY}

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging.level.root=WARN
logging.level.com.sm.instagram.platform=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# =============================================================================
# ACTUATOR - DISABLED FOR TESTS
# =============================================================================
management.endpoints.enabled-by-default=false

# =============================================================================
# PAYMENTS TOGGLE - Unit tests default to ON; payments-off suites override.
# =============================================================================
app.payments.enabled=true
