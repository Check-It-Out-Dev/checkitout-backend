# Testcontainers configuration for Windows
testcontainers.reuse.enable=true
docker.client.strategy=org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy
ryuk.disabled=false
testcontainers.docker.client.strategy=org.testcontainers.dockerclient.WindowsClientProviderStrategy

# Timeout settings (increase if Docker is slow to start)
testcontainers.startup.timeout=120
testcontainers.image.pull.pause.timeout=30

# Container reuse for faster tests
testcontainers.reuse.enable=true

# Logging
testcontainers.log.level=INFO
