# =============================================================================
# TEST CONFIGURATION - Used when running tests
# =============================================================================
# Infrastructure:
# - PostgreSQL: Testcontainers (configured by BaseTest @DynamicPropertySource)
# - Redis: Embedded Redis (configured by BaseTest @DynamicPropertySource)
#
# Secrets:
# - Local: From .env file (loaded by spring-dotenv)
# - CI/CD: From environment variables (exported by GSM step)

# =============================================================================
# SPRING CONFIGURATION
# =============================================================================
# Allow bean definition overriding for test configurations
spring.main.allow-bean-definition-overriding=true

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# These are placeholders - BaseTest will override with Testcontainers values
spring.datasource.url=jdbc:postgresql://localhost:5432/checkitout_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
postgres.superuser.username=postgres
postgres.superuser.password=postgres
# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Liquibase - will be overridden by BaseTest
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog.xml
spring.liquibase.contexts=test

# =============================================================================
# REDIS CONFIGURATION
# =============================================================================
# These are placeholders - BaseTest will override with embedded Redis values
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Disable Redis validation for embedded instance
redis.validation.enabled=false
redis.startup.test.enabled=false

# =============================================================================
# DISABLE SERVICES FOR TESTS
# =============================================================================
# Disable AdminCheckRunner in tests
admin.check.enabled=false

# Disable LocalDatabaseInitializer (Testcontainers handles it)
local.db.init.enabled=false

# Disable scheduled tasks in tests
spring.task.scheduling.enabled=false

# Disable Firebase admin setup in tests
firebase.admin.setup.enabled=false

# =============================================================================
# SECRETS FROM ENVIRONMENT VARIABLES
# =============================================================================
# =============================================================================
# FILE UPLOAD CONFIGURATION (Non-secret)
# =============================================================================
file-upload.max-file-size=5242880
file-upload.tracking.enabled=true

# =============================================================================
# JWT CONFIGURATION
# =============================================================================
jwt.secret=${JWT_SECRET:synthetic-test-jwt-secret-0123456789abcdef0123456789abcdef}
jwt.cookie.domain=localhost
jwt.cookie.secure=false

# Cookie HMAC
cookie.hmac.secret=${COOKIE_HMAC_SECRET:synthetic-test-hmac-secret-0123456789abcdef0123456789abcdef}

# =============================================================================
# FIREBASE CONFIGURATION (Non-secret)
# =============================================================================
firebase.project.id=check-it-out-47c50
# Note: Firebase API key removed - now using service account OAuth Bearer token authentication
firebase.validation.enabled=true
firebase.admin.setup.enabled=false

# Firebase Service Account (from .env)
firebase.service.account.json.base64=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# =============================================================================
# GCP CONFIGURATION (Non-secret)
# =============================================================================
gcp.project-id=check-it-out-47c50
gcp.bucket-name=check-it-out-47c50.firebasestorage.app
gcp.kms.enabled=false
gcp.kms.location=europe-central2
gcp.kms.key-ring=instagram-tokens
gcp.kms.key-name=token-encryption-key
gcp.kms.totp-key-name=totp-secrets-key
gcp.storage.enabled=true
gcp.secretmanager.enabled=false

# =============================================================================
# RECAPTCHA CONFIGURATION (Non-secret)
# =============================================================================
recaptcha.project-id=check-it-out-47c50
recaptcha.site-key=test-site-key
recaptcha.enabled=false
recaptcha.score-threshold=0.3

# =============================================================================
# ADMIN CONFIGURATION (Secrets)
# =============================================================================
admin.firebase.uid=${ADMIN_FIREBASE_UID:synthetic-admin-uid-test}
admin.email=${ADMIN_EMAIL:admin@synthetic.test}

# =============================================================================
# INSTAGRAM OAUTH CONFIGURATION (Secrets)
# =============================================================================
instagram.client-id=${INSTAGRAM_CLIENT_ID:synthetic-instagram-client-id}
instagram.client.secret=${INSTAGRAM_CLIENT_SECRET:synthetic-instagram-client-secret}
instagram.test-token=${INSTAGRAM_TEST_TOKEN:synthetic-instagram-test-token}
instagram.redirect-uri=http://localhost:8080/api/auth/social/callback/instagram
instagram.validation.enabled=true
instagram.validation.startup-check=false

# =============================================================================
# META APP CONFIGURATION (Secrets)
# =============================================================================
meta.app-id=${META_APP_ID:synthetic-meta-app-id}
meta.app-secret=${META_APP_SECRET:synthetic-meta-app-secret}

# =============================================================================
# MAXMIND CONFIGURATION
# =============================================================================
maxmind.license.key=${MAXMIND_LICENSE_KEY:}
maxmind.account-id=test-account
maxmind.database.path=./geoip/GeoLite2-City.mmdb
maxmind.update.enabled=false

# =============================================================================
# RATE LIMITING CONFIGURATION
# =============================================================================
rate-limit.enabled=true
rate-limit.algorithm=fixed-window
rate-limit.redis.key-prefix=test:rl:
# Use fixed window for predictable test behavior
rate-limit.redis.sliding-window.enabled=false
rate-limit.redis.circuit-breaker.enabled=false
rate-limit.defaults.requests=1000
rate-limit.defaults.duration=3600
rate-limit.gdpr.enabled=true
# Don't hash keys in tests for debugging
rate-limit.gdpr.anonymize-keys=false

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================
storage.mode=redis
storage.monitoring.enabled=false
storage.monitoring.alerts.enabled=false

# =============================================================================
# TOTP CONFIGURATION (Non-secret)
# =============================================================================
totp.enabled=true
totp.issuer=CheckItOut-Test

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging.level.root=WARN
logging.level.com.sm.instagram.platform=INFO
logging.level.com.sm.instagram.platform.common.authorization.AdminCheckRunner=OFF
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.liquibase=INFO
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.com.zaxxer.hikari=INFO

# =============================================================================
# TEST ENVIRONMENT
# =============================================================================
app.environment=TEST
server.port=0
server.servlet.context-path=/api

# Keep payments ON for existing tests; payments-off scenarios opt in via @TestPropertySource
app.payments.enabled=true

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================================================
# SWAGGER
# =============================================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Cred-less clone override: the BASE application.yml references ${ADMIN_EMAIL}
# with no default and @Email validation rejects the unresolved literal,
# killing every test context in a clone without .env.
app.email.admin-email=${ADMIN_EMAIL:admin@synthetic.test}

stripe.secret-key=${STRIPE_PRIVATE_KEY:sk_test_synthetic_offline_0000}
stripe.public-key=${STRIPE_PUBLIC_KEY:pk_test_synthetic_offline_0000}
