# Ansible Configuration File
# Instagram Platform VPS Deployment
#
# This configuration file controls Ansible's behavior for deploying
# the Instagram Platform infrastructure to a new VPS.
#
# Documentation: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

[defaults]
# Inventory location
inventory = ./inventory

# Roles path
roles_path = ./roles

# Disable SSH host key checking for initial deployment (enable after first connection)
# After first successful connection, enable with: host_key_checking = True
host_key_checking = False

# Number of parallel processes
forks = 10

# Timeout for SSH connections (seconds)
timeout = 30

# Retry files location (disabled to avoid clutter)
retry_files_enabled = False
retry_files_save_path = ~/.ansible-retry

# Display settings
display_skipped_hosts = False
display_args_to_stdout = False

# Ansible Vault not used - we use dummy placeholders in vault.yml files
# Real secrets replaced manually on VPS after deployment
# vault_password_file = ~/.ansible/vault-pass

# Gathering facts
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 3600

# Logging
log_path = ./ansible.log

# Default module options
module_lang = C.UTF-8
module_set_locale = True

# Callbacks
callback_whitelist = timer, profile_tasks

# Strategy plugins
strategy = linear

# Python interpreter discovery
interpreter_python = auto_silent

[inventory]
# Enable inventory plugins
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
control_path = ~/.ansible/cp/%%h-%%p-%%r

# SSH private key (regular ed25519 key for WSL)
private_key_file = ~/.ssh/id_ed25519

# Connection timeout
timeout = 30

[colors]
# Color output
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
