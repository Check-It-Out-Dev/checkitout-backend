# Firewall configuration for final hardening
# Applies iptables rules for Instagram Platform

---
- name: Deploy firewall rules script
  ansible.builtin.copy:
    src: apply-firewall-rules.sh
    dest: "{{ firewall_script_path }}"
    owner: root
    group: root
    mode: '0755'
  register: firewall_script_deployed

- name: Display firewall script deployment status
  ansible.builtin.debug:
    msg: "Firewall script: {{ 'DEPLOYED ✅' if firewall_script_deployed is changed else 'EXISTS' }}"

- name: Apply firewall rules
  ansible.builtin.command: "{{ firewall_script_path }}"
  register: firewall_result
  changed_when: firewall_result.rc == 0

- name: Display firewall application status
  ansible.builtin.debug:
    msg: "Firewall rules: {{ 'APPLIED ✅' if firewall_result.rc == 0 else 'FAILED ⚠️' }}"

- name: Display current firewall rules
  ansible.builtin.command: iptables -L -n -v
  register: iptables_rules
  changed_when: false

- name: Show applied firewall rules (summary)
  ansible.builtin.debug:
    msg:
      - "Firewall Rules Applied:"
      - "  INPUT chain: {{ iptables_rules.stdout_lines | select('match', 'Chain INPUT') | list | length }} rules"
      - "  Check full rules: sudo iptables -L -n -v"

- name: Install iptables-persistent (to persist across reboots)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  when: install_iptables_persistent | bool
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Save iptables rules
  ansible.builtin.shell: |
    iptables-save > /etc/iptables/rules.v4
    ip6tables-save > /etc/iptables/rules.v6
  when: install_iptables_persistent | bool

- name: Enable netfilter-persistent service
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: yes
    state: started
  when: install_iptables_persistent | bool

- name: Verify SSH port 22 is allowed
  ansible.builtin.command: iptables -L INPUT -n -v
  register: ssh_rule_check
  changed_when: false

- name: Assert SSH port is open
  ansible.builtin.assert:
    that:
      - "'dpt:22' in ssh_rule_check.stdout or 'ssh' in ssh_rule_check.stdout"
    success_msg: "SSH port 22 is allowed in firewall ✅"
    fail_msg: "WARNING: SSH port 22 may be blocked! ⚠️"
  ignore_errors: yes
