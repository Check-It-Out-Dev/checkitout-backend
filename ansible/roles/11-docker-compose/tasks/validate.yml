# Docker Compose validation

---
- name: Validate test Docker Compose syntax
  ansible.builtin.command: docker compose config
  args:
    chdir: "{{ test_deployment_path }}"
  become_user: "{{ user_test_deploy.name }}"
  register: test_compose_validation
  changed_when: false

- name: Validate production Docker Compose syntax
  ansible.builtin.command: docker compose config
  args:
    chdir: "{{ prod_deployment_path }}"
  become_user: "{{ user_prod_deploy.name }}"
  register: prod_compose_validation
  changed_when: false

- name: Assert compose files are valid
  ansible.builtin.assert:
    that:
      - test_compose_validation.rc == 0
      - prod_compose_validation.rc == 0
    success_msg: "All Docker Compose files validated successfully"
    fail_msg: "Docker Compose validation failed"
