# Package installation tasks
# Install essential packages for Instagram Platform

---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  when: update_apt_cache | bool

- name: Install APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present
    update_cache: yes

- name: Install build tools
  ansible.builtin.apt:
    name:
      - build-essential
      - gcc
      - g++
      - make
      - cmake
      - automake
      - autoconf
      - pkg-config
      - libtool
    state: present

- name: Install development libraries
  ansible.builtin.apt:
    name:
      - libssl-dev
      - libffi-dev
      - libxml2-dev
      - libxslt1-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - llvm
      - libncurses5-dev
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - liblzma-dev
    state: present

- name: Install Python 3 and tools
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-dev
      - python3-venv
      - python3-setuptools
      - python3-wheel
    state: present

- name: Install Git and version control
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
    state: present

- name: Install network and system tools
  ansible.builtin.apt:
    name:
      - net-tools
      - dnsutils
      - iputils-ping
      - traceroute
      - wget
      - curl
      - telnet
      - netcat-openbsd
      - htop
      - iotop
      - sysstat
      - lsof
      - strace
      - tcpdump
    state: present

- name: Install text processing tools
  ansible.builtin.apt:
    name:
      - vim
      - nano
      - jq
      - ripgrep
      - fd-find
    state: present

- name: Add PostgreSQL APT repository key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL client (NOT server)
  ansible.builtin.apt:
    name: "postgresql-client-{{ postgresql_client_version }}"
    state: present
    update_cache: yes

- name: Verify PostgreSQL server is NOT installed
  ansible.builtin.package_facts:
    manager: apt

- name: Assert PostgreSQL server not installed
  ansible.builtin.assert:
    that:
      - "'postgresql-{{ postgresql_client_version }}' not in ansible_facts.packages"
    success_msg: "PostgreSQL server not installed (correct)"
    fail_msg: "PostgreSQL server is installed (should not be)"
  ignore_errors: yes

- name: Install Certbot for SSL
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Install miscellaneous utilities
  ansible.builtin.apt:
    name:
      - rsync
      - unzip
      - zip
      - tar
      - gzip
      - bzip2
      - tree
      - tmux
      - screen
    state: present

- name: Install security tools
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
      - apparmor
      - apparmor-utils
    state: present

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Set architecture for Docker repository
  ansible.builtin.set_fact:
    docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
