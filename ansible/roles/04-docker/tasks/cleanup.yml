# Docker cleanup script deployment

---
- name: Deploy Docker cleanup script
  ansible.builtin.copy:
    src: docker-cleanup.sh
    dest: /usr/local/bin/docker-cleanup.sh
    owner: root
    group: root
    mode: '0755'

- name: Display cleanup script location
  ansible.builtin.debug:
    msg: "Docker cleanup script installed at /usr/local/bin/docker-cleanup.sh (will be scheduled in 13-automation role)"
