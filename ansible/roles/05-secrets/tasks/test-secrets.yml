# Test environment secrets deployment

---
- name: Deploy test GCP service account JSON
  ansible.builtin.copy:
    content: "{{ vault_gcp_service_account_test }}"
    dest: "{{ test_secrets_path }}/service-account.json"
    owner: "{{ user_test_deploy.name }}"
    group: "docker-secrets-test"
    mode: "{{ secret_file_permissions }}"
  when: vault_gcp_service_account_test is defined
  no_log: true
  tags: [gcp-secrets]
  register: test_gcp_deploy

- name: Display test GCP service account deployment status
  ansible.builtin.debug:
    msg: "Test GCP service account: {{ 'Deployed to ' + test_secrets_path + '/service-account.json' if test_gcp_deploy is changed else 'Skipped or already exists' }}"

- name: Generate test environment .env file
  ansible.builtin.template:
    src: env-test.j2
    dest: "{{ test_deployment_path }}/.env"
    owner: "{{ user_test_deploy.name }}"
    group: "docker-secrets-test"
    mode: "{{ secret_file_permissions }}"
    validate: '/usr/bin/env -i bash -c "set -a; source %s; set +a"'
    backup: yes
  when: deploy_env_files | default(false)
  tags: [env-files]

- name: Display test .env file status
  ansible.builtin.debug:
    msg: "Test .env file: {{ 'Deployed' if deploy_env_files | default(false) else 'Skipped (managed by GitHub Actions)' }}"

- name: Verify test secrets directory permissions
  ansible.builtin.file:
    path: "{{ test_secrets_path }}"
    owner: "{{ user_test_deploy.name }}"
    group: "docker-secrets-test"
    mode: "{{ secret_dir_permissions }}"
    state: directory
