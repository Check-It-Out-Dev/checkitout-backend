# Production environment secrets deployment

---
- name: Deploy production GCP service account JSON
  ansible.builtin.copy:
    content: "{{ vault_gcp_service_account_prod }}"
    dest: "{{ prod_secrets_path }}/service-account.json"
    owner: "{{ user_prod_deploy.name }}"
    group: "docker-secrets-prod"
    mode: "{{ secret_file_permissions }}"
  when: vault_gcp_service_account_prod is defined
  no_log: true
  tags: [gcp-secrets]
  register: prod_gcp_deploy

- name: Display production GCP service account deployment status
  ansible.builtin.debug:
    msg: "Production GCP service account: {{ 'Deployed to ' + prod_secrets_path + '/service-account.json' if prod_gcp_deploy is changed else 'Skipped or already exists' }}"

- name: Generate production environment .env file
  ansible.builtin.template:
    src: env-prod.j2
    dest: "{{ prod_deployment_path }}/.env"
    owner: "{{ user_prod_deploy.name }}"
    group: "docker-secrets-prod"
    mode: "{{ secret_file_permissions }}"
    validate: '/usr/bin/env -i bash -c "set -a; source %s; set +a"'
    backup: yes
  when: deploy_env_files | default(false)
  tags: [env-files]

- name: Display production .env file status
  ansible.builtin.debug:
    msg: "Production .env file: {{ 'Deployed' if deploy_env_files | default(false) else 'Skipped (managed by GitHub Actions)' }}"

- name: Verify production secrets directory permissions
  ansible.builtin.file:
    path: "{{ prod_secrets_path }}"
    owner: "{{ user_prod_deploy.name }}"
    group: "docker-secrets-prod"
    mode: "{{ secret_dir_permissions }}"
    state: directory
