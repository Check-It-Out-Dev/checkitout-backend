# Loki secrets deployment

---
- name: Deploy Loki GCP service account
  ansible.builtin.copy:
    content: "{{ vault_loki_gcp_service_account }}"
    dest: "{{ loki_secrets_path }}/service-account.json"
    owner: "{{ loki_container_uid | default(10001) }}"
    group: "{{ loki_container_gid | default(10001) }}"
    mode: '0640'
  when: vault_loki_gcp_service_account is defined
  no_log: true
  tags: [loki-secrets]

- name: Verify Loki service account file exists
  ansible.builtin.stat:
    path: "{{ loki_secrets_path }}/service-account.json"
  register: loki_sa_file

- name: Display Loki service account deployment status
  ansible.builtin.debug:
    msg: "Loki service account: {{ 'Deployed' if loki_sa_file.stat.exists else 'Not found' }}"
