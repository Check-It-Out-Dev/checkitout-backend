# Secrets directories creation (CRITICAL permissions)

---
- name: Create test secrets directory
  ansible.builtin.file:
    path: "{{ test_secrets_path }}"
    state: directory
    owner: "{{ user_test_deploy.name }}"
    group: "docker-secrets-test"
    mode: "{{ dir_permissions_secrets }}"

- name: Ensure test secrets parent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ dir_permissions_standard }}"
  loop:
    - "/etc/instagram-platform"
    - "/etc/instagram-platform/test"

- name: Create production secrets directory
  ansible.builtin.file:
    path: "{{ prod_secrets_path }}"
    state: directory
    owner: "{{ user_prod_deploy.name }}"
    group: "docker-secrets-prod"
    mode: "{{ dir_permissions_secrets }}"

- name: Ensure production secrets parent directories exist
  ansible.builtin.file:
    path: "/etc/instagram-platform/prod"
    state: directory
    owner: root
    group: root
    mode: "{{ dir_permissions_standard }}"
