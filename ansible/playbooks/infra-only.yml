# Infrastructure Only Playbook
# Instagram Platform - Deploy Infrastructure Without Applications
#
# This playbook deploys only infrastructure (no application configs).
# Useful for preparing the VPS without deploying apps yet.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/infra-only.yml

---
- name: Instagram Platform - Infrastructure Only
  hosts: instagram_platform
  become: true
  gather_facts: yes

  pre_tasks:
    - name: Display deployment information
      ansible.builtin.debug:
        msg:
          - "Deploying infrastructure only"
          - "Applications will NOT be configured"

  roles:
    # Foundation
    - role: ../roles/01-base-system
      tags: [infra, base]

    - role: ../roles/02-users-groups
      tags: [infra, users]

    - role: ../roles/03-directories
      tags: [infra, dirs]

    - role: ../roles/04-docker
      tags: [infra, docker]

    # Configuration
    - role: ../roles/06-scripts
      tags: [infra, scripts]

    - role: ../roles/07-systemd
      tags: [infra, systemd]

    - role: ../roles/08-nginx
      tags: [infra, nginx]

    - role: ../roles/09-sudoers
      tags: [infra, sudoers]

    # Security
    - role: ../roles/14-security
      tags: [infra, security]

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "Infrastructure deployment complete"
          - "Applications NOT deployed"
          - "To deploy applications: ansible-playbook -i inventory/production.yml playbooks/apps-only.yml"
