# Disable Passwordless Sudo for Ubuntu User
# Instagram Platform - Security Hardening
#
# This removes NOPASSWD from ubuntu user's sudo permissions
# After running this, ubuntu user will need to enter password for sudo commands
#
# ⚠️  WARNING: Ensure you know the ubuntu user password before running!
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/disable-ubuntu-passwordless-sudo.yml

---
- name: Disable Passwordless Sudo for Ubuntu User
  hosts: instagram_platform
  become: true
  gather_facts: no

  pre_tasks:
    - name: Display critical warning
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "⚠️  DISABLE PASSWORDLESS SUDO WARNING ⚠️"
          - "=========================================="
          - "This will require ubuntu user to enter password for sudo"
          - ""
          - "BEFORE proceeding, ensure:"
          - "  1. You know the ubuntu user password"
          - "  2. You have console access (OVH VNC/KVM)"
          - "  3. You have tested sudo with password"
          - ""
          - "Deployment users (instagram-*) are NOT affected"
          - "They keep their NOPASSWD permissions for CI/CD"
          - "=========================================="

    - name: Pause for 15 seconds - REVIEW WARNING ABOVE
      ansible.builtin.pause:
        seconds: 15
        prompt: |

          Press Ctrl+C NOW if you are not ready!

          Do you know the ubuntu password?
          Have console access ready?

          Continuing in 15 seconds...

  tasks:
    - name: Backup current cloud-init sudoers
      ansible.builtin.copy:
        src: /etc/sudoers.d/90-cloud-init-users
        dest: "/etc/sudoers.d/90-cloud-init-users.backup-{{ ansible_date_time.date }}"
        remote_src: yes
        mode: '0440'

    - name: Remove NOPASSWD from ubuntu user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-cloud-init-users
        regexp: '^ubuntu ALL=\(ALL\) NOPASSWD:ALL'
        line: 'ubuntu ALL=(ALL) ALL'
        validate: '/usr/sbin/visudo -c -f %s'
        state: present

    - name: Validate sudoers configuration
      ansible.builtin.command: visudo -c
      register: visudo_check
      changed_when: false

    - name: Display validation result
      ansible.builtin.debug:
        msg: "Sudoers validation: {{ 'PASSED ✅' if visudo_check.rc == 0 else 'FAILED ⚠️' }}"

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Passwordless Sudo Disabled for Ubuntu!"
          - "=========================================="
          - "Ubuntu user now requires password for sudo"
          - ""
          - "⚠️  CRITICAL: Test sudo NOW!"
          - ""
          - "In a NEW terminal, test:"
          - "  ssh ubuntu@{{ ansible_host }}"
          - "  sudo whoami"
          - "  (enter password when prompted)"
          - ""
          - "If it works, you're good!"
          - "If it fails, use console access (OVH VNC/KVM)"
          - "  and restore: sudo cp /etc/sudoers.d/90-cloud-init-users.backup-* /etc/sudoers.d/90-cloud-init-users"
          - "=========================================="
          - ""
          - "Deployment users (instagram-*) still have NOPASSWD for their specific commands (for CI/CD)"
